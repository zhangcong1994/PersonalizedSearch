# 实验计划：V1 生成模型 Prompt 工程优化
# exp-010: Qwen3-8B 在 AI 搜索场景下的 Prompt 迭代优化
# 创建日期：2026-06-02
# 最后更新：2026-06-03
#
# 注：
#   - exp-009 原计划 DPO 偏好对齐，现留空（exp-010 被 Prompt 工程占用）
#   - 本实验不涉及模型训练，纯 prompt 迭代 + 评估
#   - 检索输入固定（exp-004 精排 top-10），仅更换 prompt
#   - 评估沿用 exp-005 Judge 体系（deepseek-chat, 6 维两批）
#   - exp-005 已跑完 8B non-thinking (60.9) 和 thinking (60.5)，8B 比 4B 有更大的潜力窗口

meta:
  experiment_id: exp-010
  phase: "V1"
  objective: "通过系统化的 Prompt 工程迭代，在不训练模型的前提下，将 Qwen3-8B 的生成质量从 60.9 分提升至显著高于基线的水平。同时测试 thinking 模式与新 prompt 的交互效应（基线 thinking 在整合/引文上微超 non-thinking，新 prompt 可能放大这一优势或抵消)"
  status: planned
  target_platform: "本地 RTX 4090 (vLLM) 或 AutoDL"
  prerequisite: "exp-005 8B 双模式基线已出（nt 60.9 / t 60.5）+ exp-009 SFT 结果已出（确认 SFT 不适合）"
  design_principle: "单变量消融 —— 每个 Phase 只改一个 prompt 变量，用同一批 198 条评估数据测量效果，拒绝同时改多个变量的'散弹枪'做法。主力在 non-thinking 上迭代，thinking 做关键节点对照"
  key_references:
    - "exp-005: Qwen3-8B-nonthink 基线 60.9 分, thinking 基线 60.5 分, 6 维分项已知"
    - "exp-005 发现 7: 8B vs 4B 参数量翻倍几乎零增益（+0.7），但 8B-thinking 在整合(2.35)和引文(2.53)上微超 non-thinking，存在潜力窗口"
    - "exp-009: SFT 两次训练均退化（-9~-10 分），根因模型学会格式而非整合"
    - "prompt 端痛点分析：6 个痛点 × 对应提示词招式（详见 exp-010 设计文档）"


# =============================================================================
# 第一部分：动机 —— 为什么 Prompt 工程是 SFT 失败后的最优方向
# =============================================================================

motivation:

  why_prompt_after_sft_failure:
    core_reason: |
      exp-009 证明 SFT 不适合该场景（4B 上）：2172 条高质量训练数据（教师均分 82.3）+ 两次不同参数训练，
      结果稳定比基线差 9-10 分。根因：小模型通过 SFT 无法习得跨文档整合能力。
      exp-005 发现 7 进一步确认：4B→8B 参数量翻倍几乎零增益（+0.7 分），
      说明单纯增加参数无法突破整合瓶颈——但 8B-thinking 在整合(2.35)和引文(2.53)上
      微超 non-thinking，暗示 8B 有 4B 不具备的"结构化思考潜力窗口"。
      
      假设：如果给 8B 一个明确的思考框架（我们的分步指令 prompt），它可以利用
      更大的参数空间把这种结构化思考能力释放出来——效果可能远超 4B 上的微幅波动。

    sft_negative_evidence:
      - "整合质量：2.31 (4B基线) → 1.94 (4B SFT V2)，−0.37"
      - "引文质量：2.45 (4B基线) → 2.09 (4B SFT V2)，−0.36"
      - "用户体验：3.11 (4B基线) → 2.66 (4B SFT V2)，−0.45"
      - "准确性/安全性/相关性：SFT 前后基本无变化（这三维不敏感于训练）"
      - "8B non-thinking 基线 60.9：参数量翻倍但总分仅 +0.7，整合 2.27 甚至低于 4B 的 2.31"

    prompt_sensitivity_hypothesis: |
      在评估标准 11 维 × 提示词敏感性分析中，有 5 个维度对 prompt 高度敏感：
      - 整合质量（高敏感）：prompt 能教模型"如何整合"
      - 拒答判断（高敏感）：prompt 一句话可翻转拒答行为
      - 结构适配（高敏感）：prompt 直接控制输出格式
      - 指令遵循（高敏感）：prompt 工程本身的度量
      - 用户体验（中高敏感）：prompt 决定输出风格和篇幅
      
      其中整合质量是核心——它是 exp-009 失败模式的根因，也是 AI 搜索区别于 RAG 的差异化维度。

    cost_advantage:
      - "SFT: 数据构造 6 阶段 pipeline + QLoRA 训练 × 2 次 + GPU 租赁，总耗时 2-3 天"
      - "Prompt 工程: 改文本 + 跑评估（vLLM 推理 198 条 ~5 分钟 + Judge 评分 ~30 分钟），单个 Phase 迭代 < 1 小时"
      - "迭代速度比 SFT 快 50 倍以上，且不需要 GPU 训练资源"

  what_this_experiment_does_not_do:
    - "不修改检索 pipeline（exp-003 S4 + exp-004 reranker 固定）"
    - "不修改评估标准（沿用 exp-005 6 维 Judge，确保分数可比）"
    - "不训练模型（纯 prompt 迭代）"
    - "不修改温度/推理参数（temperature=0.3, max_tokens=1024 固定）"
    - "不在同一 Phase 修改多个 prompt 变量（单变量消融原则）"


# =============================================================================
# 第二部分：实验模型与评估设置
# =============================================================================

experiment_setup:

  models_under_test:
    primary:
      id: "qwen3-8b-nonthink"
      hf_id: "Qwen/Qwen3-8B"
      backend: "vLLM"
      temperature: 0.3
      max_tokens: 1024
      thinking: "OFF"
      role: "主力实验对象 —— exp-005 基线 60.9，所有 Phase 都在此模型上评估"
    secondary:
      - id: "qwen3-8b-thinking"
        hf_id: "Qwen/Qwen3-8B"
        backend: "vLLM"
        temperature: 0.3
        max_tokens: 1024
        thinking: "ON"
        role: "Phase 3 完成后跑最优 prompt，测试新 prompt 与 thinking 模式的交互效应（基线 thinking 在整合/引文微超 non-thinking，新 prompt 可能放大此优势）"
    reference:
      id: "qwen3-4b-nonthink"
      hf_id: "Qwen/Qwen3-4B"
      score: 60.2
      role: "4B 参照 —— 如果 8B prompt 收益远超 4B，说明大参数 + 好 prompt 有乘数效应"
    upper_bound:
      id: "qwen3-max"
      backend: "阿里云 API"
      score: 72.7
      role: "质量上界参照，不参与 prompt 迭代"

  evaluation:
    dataset: "exp-005 198 条 dev 集（T2Ranking, exp-004 bge-reranker-v2-m3 精排 top-10）"
    judge_model: "deepseek-chat"
    judge_protocol: "6 维两批（exp-005 标准 Judge Prompt），Batch1: 准确性+安全性+相关性, Batch2: 整合+引文+体验"
    primary_metric: "Avg 总分 (0-100)"
    secondary_metrics:
      - "Pass%"
      - "各维度分项（特别是整合质量）"
      - "D 级占比"
    cost_per_eval: "198 条 × 2 批 Judge 调用 ≈ ¥2-3"

  baseline:
    model: "qwen3-8b-nonthink"
    prompt: "exp-005 原版（src/generation/prompts.py）"
    score: 60.9
    pass_pct: "60.4%"
    dim_scores:
      veracity: 3.18
      safety: 3.63
      relevance: 3.64
      synthesis_quality: 2.27
      citation_quality: 2.47
      user_experience: 3.11
    d_grade_pct: "36.4%（72/198）"
    note: "8B thinking 基线: 60.5 分, 整合 2.35, 引文 2.53, 准确性 2.95（thinking 在信息综合维度上有微幅优势，但准确性大跌）"


# =============================================================================
# 第三部分：实验阶段 —— 按痛点优先级递进
# =============================================================================

phases:

  # ========================================================================
  # Phase 1: 修复文档格式信号 + 分步推理指令（整合质量攻坚）
  # ========================================================================
  - id: phase-1
    name: "文档格式修复 + 分步整合指令"
    priority: P0
    target_dimensions:
      primary: "synthesis_quality（整合质量）—— exp-009 失败的根因"
      secondary: "user_experience（用户体验）—— 减少罗列自然提升可读性"

    pain_points_addressed:
      - pain_point: "痛点五：文档格式在喂错误信号"
        description: |
          当前输入侧用 `[1] 来源: doc-1024`，输出侧引用格式用 `[来源: 3]`。
          两者共用 `[来源: N]` 标记，4B 模型可能混淆文档标记和引用标记。
          且 `[N] 来源: xxx` 的结构天然诱导模型"逐篇输出"。
        fix: |
          输入侧改为纯编号 `[文档 1]`，与输出侧的 `[来源: N]` 彻底区分。
          prompt 中对应修改 few-shot 示例的输入格式。
        industry_ref: "Format Disambiguation — Anthropic Prompt Design Guide"

      - pain_point: "痛点一：模型不会整合、只会罗列"
        description: |
          当前 prompt 说了一句"综合多篇资料"但没有告诉模型"如何综合"。
          4B 模型需要显式的子步骤指令，把"综合"这个抽象任务分解为可执行的操作序列。
        fix: |
          在 prompt 中加入明确的分步推理指令：
          步骤 1 — 提取关键点
          步骤 2 — 合并重复
          步骤 3 — 连接互补
          步骤 4 — 识别矛盾
          整理完成后，再按核心结论→展开细节→标注矛盾的顺序组织答案。
        industry_ref: "Chain-of-Thought (Wei et al., 2022) + Least-to-Most Prompting (Zhou et al., 2023)"

    prompt_changes:
      code_changes:
        - file: "scripts/exp010/generate_exp010.py"
          line_range: "L82-L84 (build_prompt 函数)"
          note: "已内置 [文档 N] 格式（与旧版 generate_exp005.py 不同的关键差异）"
      prompt_changes:
        - file: "src/generation/prompts_v2.py"
          version: "v1-full"
          changes:
            - "few-shot 示例中的输入格式已使用 [文档 N]"
            - "核心原则第 2 条替换为「整合步骤」分步推理指令（步骤1-4）"
            - "新增「避免以下行为」区块（较低强度负面约束，为 Phase 2 硬规则区留出递进空间）"

    evaluation:
      model: "qwen3-4b-nonthink"
      dataset: "198 条"
      comparison: "Phase 1 prompt vs 基线 prompt（exp-005 原版）"

    success_criteria:
      primary: "整合质量从 2.27 提升至 ≥ 2.40（+0.13），或 D 级占比从 36.4% 降至 ≤ 31%"
      secondary: "总分不低于基线 60.9（不允许其他维度显著退化）"
      failure: "整合质量无变化或下降，且失败模式仍以「逐篇罗列」为主"
      significance_note: |
        198 条样本下 +0.14 的维度级变化需要结合分布检验判断显著性。
        如果整合质量均值 +0.1 以上且 D 级占比下降 ≥ 3pp，视为正向信号。
        如果变化在 ±0.05 以内，视为无效（噪声级别波动）。


  # ========================================================================
  # Phase 2: 对比提示 + 硬规则强化（整合质量持续攻坚）
  # ========================================================================
  - id: phase-2
    name: "对比示例 + 硬性规则区"
    priority: P1
    depends_on: "phase-1（在 phase-1 最优 prompt 基础上叠加，而非从基线 fork）"
    target_dimensions:
      primary: "synthesis_quality（整合质量）"
      secondary: "instruction_following（指令遵循，可单独评估）"

    pain_points_addressed:
      - pain_point: "痛点三：只有正面示例，没有对比示例"
        description: |
          2 个 few-shot 示例只有正面示范。模型没见过"坏答案"的样子，
          无法通过对比学习什么行为是被禁止的。人类学习时，对比往往比单一面示例更高效。
        fix: |
          在 few-shot 中新增一个"对比示例"：
          同一组输入，先展示 ❌ 错误版本（逐篇罗列），标注"为什么错"，
          再展示 ✅ 正确版本（整合后输出）。
        industry_ref: "Contrastive Prompting (Wang et al., 2023)"

      - pain_point: "痛点四：负面约束太软"
        description: |
          当前 4 条核心原则中的负面约束分散在段落里，模型注意力被稀释。
          需要一个结构独立的"硬规则区"，提高注意权重。
        fix: |
          在 prompt 中增加 `=== 硬性规则（违反任一条则不合格）===` 区块，
          用 Markdown 标题层级 + 视觉分隔符标记为高优先级指令。
        industry_ref: "Instruction Hierarchy + Microsoft Prompt Bench (2024)"

    prompt_changes:
      - file: "src/generation/prompts_v2.py"
        version: "v2"
        changes:
          - "新增「=== 硬性规则 ===」区块（禁止逐篇罗列、禁止编造、禁止元描述）"
          - "新增 1 个对比示例（示例 2: ❌ 逐篇罗列 vs ✅ 整合后输出）"
          - "原核心原则简化为 4 条要点（硬规则已提前到区块中声明）"

    evaluation:
      model: "qwen3-4b-nonthink"
      dataset: "198 条"
      comparison: "Phase 2 prompt vs Phase 1 prompt（测量叠加收益）"

    success_criteria:
      primary: "整合质量在 Phase 1 基础上再提升 ≥ 0.05，且累计（vs 基线）≥ +0.15"
      secondary: "指令遵循（G-A）维度的违反率下降（快速评估模式下可单独抽样评）"
      failure: "叠加后整合质量未进一步提升，或引入新的格式错误"


  # ========================================================================
  # Phase 3: 分级拒答指引 + 查询类型判断
  # ========================================================================
  - id: phase-3
    name: "分级拒答 + 查询类型前置判断"
    priority: P1
    depends_on: "phase-2（在 phase-2 最优 prompt 基础上叠加）"
    target_dimensions:
      primary: "user_experience + relevance（拒答质量、结构适配）"
      secondary: "citation_quality（引用行为更规范）"

    pain_points_addressed:
      - pain_point: "痛点二：拒答行为不可控"
        description: |
          当前 prompt 只在"全部资料无法回答"时给了指令。对"部分信息可用"
          "多文档矛盾"两种常见情况完全没有指导。基线 76 条 D 级输出中，
          有一部分是"信息不足时强行编造"。
        fix: |
          在 prompt 中给出 3 级拒答/回答指引：
          - 资料完全不相关 → 明确拒答 + 建议换方式提问
          - 资料部分相关 → 回答已知部分 + 说明局限性
          - 资料存在矛盾 → 呈现双方说法 + 标注分歧
        industry_ref: "Constitutional AI 分级行为规范 + FACTS Grounding (Google DeepMind) calibrated uncertainty"

      - pain_point: "痛点六：缺少查询类型前置判断"
        description: |
          当前 prompt 说"用什么格式由问题本身决定"但没有教模型判断。
          qwen3-max 在体验维度领先 0.47 分，部分因为它能自动匹配格式。
          但 4B 模型需要显式的分类→路由指令。
        fix: |
          在 prompt 中加入查询类型判断规则：
          - 事实型 → 直接答案 + 引用
          - 对比型 → 表格并排 + 解读
          - 操作型 → 分步编号
          - 原因型 → 核心原因 + 逐点展开
          让模型先判断类型再选择结构，而非"自动适配"。
        industry_ref: "Task Decomposition + Meta-Prompting (Google Search Generative Experience)"

    prompt_changes:
      - file: "src/generation/prompts_v2.py"
        version: "v3"
        changes:
          - "新增「=== 查询类型判断 ===」区块（5 类 × 对应结构）"
          - "新增「=== 面对不同资料情况的回答策略 ===」区块（ABCD 四场景）"
          - "原核心原则第 4 条更新为引用 ABCD 场景"

    evaluation:
      model: "qwen3-4b-nonthink"
      dataset: "198 条"
      comparison: "Phase 3 prompt vs Phase 2 prompt（测量叠加收益）"

    success_criteria:
      primary: "总 Pass% 从 60.4% 提升至 ≥ 64%（D 级中误拒答/强行回答的 case 被修复）"
      secondary: "用户体验从 3.11 提升至 ≥ 3.20（结构适配提升自然反映在此维度）"
      failure: "Pass% 无变化，或过度拒答导致相关性维度下降"


  # ========================================================================
  # Phase 4: thinking 模式对照 + 消融分析
  # ========================================================================
  - id: phase-4
    name: "thinking 对照 + 消融分析"
    priority: P2
    depends_on: "phase-3（需要在最优 prompt 确定后进行）"
    target_dimensions:
      primary: "全维度 —— 新 prompt 与 thinking 模式的交互效应"
      secondary: "各 Phase 贡献的消融归因"

    objectives:
      - objective: "thinking vs non-thinking 在新 prompt 下的对照"
        description: |
          用 Phase 3 最优 prompt 在 Qwen3-8B-thinking 上跑 198 条。
          基线状态下：thinking 总分 60.5（nt 60.9），整合 2.35（nt 2.27），引文 2.53（nt 2.47），
          但准确性大跌 2.95（nt 3.18）。
          
          核心问题：新 prompt 的外部化分步指令 + thinking 的内部推理链，
          是互相抵消（总计 < 60.9），互相促进（总计 > 61.5），还是选择性提升
          （整合/引文大幅上涨但准确性仍低）？
        evaluation: "Phase 3 prompt (v3) on 8B-thinking vs Phase 3 prompt (v3) on 8B-nonthink"

      - objective: "单变量消融（8B-nonthink 上）"
        description: |
          对 Phase 1-3 的每个改动做消融：从最优 prompt 中逐个移除改动，测量边际贡献。
          
          消融矩阵（均在 8B-nonthink 上，每个变体 50 条）：
          Prompt v3 = 最优 (Phase 1+2+3 全部)
          Prompt abl-no-cot = v3 − 分步指令
          Prompt abl-no-contrast = v3 − 对比示例
          Prompt abl-no-rules = v3 − 硬规则区
          Prompt abl-no-refusal = v3 − 分级拒答
          Prompt v0 = 基线（原版，作为参照）
          
          比较各维度差异，计算每个改动的边际贡献。

    evaluation:
      model: "qwen3-8b-nonthink（消融，50 条） + qwen3-8b-thinking（对照，198 条）"
      dataset: "198 条（thinking 对照） + 50 条（消融）"

    success_criteria:
      primary: "thinking 模式下最优 prompt 的总分与 non-thinking 最优版的分差 ≤ 2 分（允许权衡取舍），且整合质量至少一个模式 ≥ 2.45"
      secondary: "消融分析明确每个改动的边际贡献，若某改动移除后分数下降 > 1 分则该改动为关键贡献"


# =============================================================================
# 第四部分：总体成功判定与决策树
# =============================================================================

overall_success_criteria:

  level_excellent:
    condition: "总分从 60.9 提升至 ≥ 65.5（+4.6），且整合质量 ≥ 2.50（+0.23）"
    decision: "Prompt 工程路线验证成功，进入 V2 阶段。将最优 prompt 固化为系统默认"

  level_good:
    condition: "总分从 60.9 提升至 ≥ 63.5（+2.6），且整合质量 ≥ 2.40（+0.13）"
    decision: "Prompt 工程有实质收益。如果 thinking 模式在整合维度有额外增益，考虑 thinking + 定制 prompt 的混合方案"

  level_marginal:
    condition: "总分在 60.9 ± 1.0 范围内波动，整合质量无显著变化"
    decision: "Prompt 工程对此场景的增益存在天花板。转向 DPO/GRPO 路线或接受本地模型 61 分的现实，生产上走 API 兜底策略"

  level_failure:
    condition: "任一 Phase 总分下降超过 2 分，或整合质量显著退化"
    decision: "Prompt 工程不适合此场景。回归 exp-009 结论：中小模型在 AI 搜索的多文档整合任务上存在根本性能力壁垒"


# =============================================================================
# 第五部分：数据与文件规划
# =============================================================================

data:
  input_queries: "data/exp005_queries.jsonl（exp-005 同一批 198 条，含 exp-004 精排 top-10）"
  output_dir: "results/exp010/"
  generations_dir: "results/exp010/generations/"
  judge_dir: "results/exp010/judge_scores/"
  naming_convention: "{model_id}-{phase_id}-{variant}.jsonl"

files:
  new:
    - "src/generation/prompts_v2.py"       # 所有 Phase 的 prompt 变体 + PromptV2Manager
    - "scripts/exp010/__init__.py"         # 包标记
    - "scripts/exp010/generate_exp010.py"  # 自包含生成脚本（支持 --prompt-version）
    - "scripts/exp010/run_phase.py"        # Phase 全流程 orchestrator（生成 → Judge → 对比）
    - "scripts/exp010/prepare_exp010_data.py"    # 消融用 50 条分层抽样
    - "scripts/exp010/summarize_ablation.py"     # 消融结果汇总分析
  reused:
    - "scripts/exp005/run_judge_exp005.py"       # Judge 脚本完全复用（不改动）
    - "src/evaluation/judge_prompts.py"          # Judge Prompt 不变
    - "src/evaluation/aggregation.py"            # 聚合逻辑不变
    - "data/exp005_queries.jsonl"                # 同一批 198 条输入数据不变

iteration_cost:
  per_phase:
    generation: "198 条 vLLM 推理 ~5 分钟"
    judge: "198 条 × 2 批 × deepseek-chat ~¥2-3, ~30 分钟"
    analysis: "跑分脚本 + 人工看 case ~30 分钟"
    total: "~1 小时 / Phase"
  total_estimated: "Phase 1-4 全部完成 ~4-6 小时, 总 API 成本 ~¥15-20"


# =============================================================================
# 第六部分：风险与注意事项
# =============================================================================

risks:

  - risk: "Phase 1 整合质量无变化"
    likelihood: "中等"
    mitigation: |
      如果分步指令在 8B 上也无反应，说明整合行为可能不是"指令问题"而是
      "能力问题"——模型即使被告知了步骤，也无法执行。此时直接跳到 Phase 4
      thinking 对照，看内置推理链是否比外部指令更有效。如果 thinking 也无变化，
      提前终止实验。

  - risk: "新 prompt 让 thinking 模式准确性进一步大跌"
    likelihood: "低中"
    mitigation: |
      外部指令 + 内部推理 = 认知过载，可能让 thinking 模式过度分析而偏离事实。
      如果 thinking 准确性比基线 2.95 还低 > 0.2，则确认 thinking 不兼容此 prompt 范式。
      保留 non-thinking 版作为最终方案。

  - risk: "消融分析发现核心收益来自文档格式修复，其他改动均无效"
    likelihood: "中"
    mitigation: |
      如果只有 [文档 N] 格式修复有效、分步指令/对比示例/硬规则均无额外增益，
      说明 prompt 内容优化已穷尽——剩下的问题是模型能力而非指令质量。
      接受结果，结论为"Prompt 工程的核心价值在格式消歧"，后续转 DPO/GRPO。

  - risk: "Judge 对 prompt 变更后的输出产生系统性偏差"
    likelihood: "中低"
    mitigation: |
      Judge 是同一套标准（deepseek-chat + 固定 Judge Prompt），应该免疫生成端 prompt 变更。
      但如果在极端 case（如新 prompt 让模型输出格式完全不同）下 Judge 行为异常，
      抽样人工检查 10-20 条确认。
