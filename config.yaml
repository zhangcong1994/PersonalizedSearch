paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  vector_db_dir: "data/vector_db"

models:
  local_cache_dir: "models"
  registry:
    bge-small-zh-v1.5:
      hf_id: "BAAI/bge-small-zh-v1.5"
      dim: 512
      local_dir: "bge-small-zh-v1.5"
    bge-large-zh-v1.5:
      hf_id: "BAAI/bge-large-zh-v1.5"
      dim: 1024
      local_dir: "models--BAAI--bge-large-zh-v1.5"
    m3e-base:
      hf_id: "moka-ai/m3e-base"
      dim: 768
      local_dir: "models--moka-ai--m3e-base"
    bge-m3:
      hf_id: "BAAI/bge-m3"
      dim: 1024
      local_dir: "models--BAAI--bge-m3"

indexing:
  chunk_size: 500
  chunk_overlap: 50
  embedding_model: "BAAI/bge-small-zh-v1.5"
  vector_db:
    type: "chromadb"
    path: "./data/vector_db/"
    collection_name: "zhwiki_articles"

retrieval:
  top_k: 5
  search_type: "similarity"

intent:
  api_client:
    type: "deepseek"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    max_tokens: 512
    temperature: 0.1
  prompt_template: "query_rewrite_basic"

generation:
  api_client:
    type: "deepseek"
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"
    max_tokens: 1024
    temperature: 0.3

data:
  download:
    aol4ps_url: "https://github.com/AnnKwok/AOL4PS/raw/main/"
    save_dir: "./data/raw/aol4ps/"
    timeout: 300
    max_retries: 3
  raw_path: "./data/raw/"
  processed_path: "./data/processed/"

wikipedia:
  xml_path: "./data/raw/wikipedia/zhwiki-latest-pages-articles.xml"
  jsonl_path: "./data/processed/wikipedia_articles.jsonl"
  parse:
    num_articles: 30000
    min_text_length: 200

logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"
