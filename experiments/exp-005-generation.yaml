    expected_role: "本地部署质量基准"

  # ========== Group C：API 强模型（生成质量上界）==========

  - id: "deepseek-chat"
    name: "DeepSeek-V3 (deepseek-chat)"
    provider: "DeepSeek API"
    backend: "api"
    params: "671B (MoE, 37B activated)"
    context_len: 131072
    cost_1k_input: "¥0.002"
    cost_1k_output: "¥0.008"
