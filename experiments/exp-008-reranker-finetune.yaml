# =============================================================================
# 第九部分：分析问题
# =============================================================================

analysis_questions:

  primary:
    - "Q1: gte-mul 在 T2Ranking 上微调后，NDCG@10 能从 0.4442 提升到多少？是否能追上零样本 bge-v2-m3（0.4717）？"
    - "Q2: 新候选池（finetuned m3e）对精排指标的间接提升有多大（Group B vs Group A）？Embedding 微调对精排的贡献占总提升的比例？"
    - "Q3: 精排微调后（Group C），NDCG@10 绝对值和相对提升幅度是多少？领域微调是否能让干净模型超越有泄露的通用模型？"

  secondary:
    - "Q4: pos_weight 是否影响训练质量？正负比 1:16 的 BCE 训练是否稳定？"
    - "Q5: Embedding 微调（粗排召回提升）和 Reranker 微调（精排排序提升）各自对端到端 NDCG@10 的贡献比例？"

  optional_ablation_questions:
    - "Q6: label=3 vs label=0 去噪训练是否优于全 label>0 训练？label=1,2 是信号还是噪声？"
    - "Q7: 候选池从 top-50 扩大到 top-100 是否带来 NDCG 增益？新增负样本的边际价值 vs 额外训练成本？"


