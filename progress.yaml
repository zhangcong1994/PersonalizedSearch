experiment_summary:
  - id: exp-001
    name: 检索基线（BM25 vs Dense）
    status: done
    date_range: 2026-05-17 ~ 2026-05-18
    summary: "建立 BM25 与 Dense（m3e-base/bge 系列）双后端检索基线，消融嵌入模型、分片策略对 Recall/MRR 的影响，确定最优 Dense 单路基线全量 R@10=0.4548 (bge-small) / R@10=0.3893 (m3e-base)。"
    best_result: "bge-small-zh-v1.5, R@10=0.4548, MRR=0.5097（全量 230 万 passage）"
    files:
      plan: experiments/exp-001-retrieval-baseline.yaml

  - id: exp-002
    name: 查询重写增强检索
    status: done
    date_range: 2026-05-18 ~ 2026-05-20
    summary: "通过 Prompt 工程（领域 few-shot、对比示例、类型感知）、Multi-Query RRF 融合、HyDE 预回答扩展、PRF 伪相关反馈四组实验提升召回率。最优方案 HyDE+原查询 RRF 融合在 Dense 后端 R@50=0.6819（+8.6% vs 基线），BM25 后端同样受益最大（+11.1%）。"
    best_result: "Dense E2c-H2 (HyDE+原查询 RRF), R@50=0.6819"
    key_findings:
      - "领域 few-shot（P2）在单查询改写中全面最优，比通用示例高 4%"
      - "HyDE + RRF 是全部 16 组实验中最大赢家，在两个后端上均取得最高 R@50"
      - "对比示例（P3）、类型感知（P4）、关键词串（P5）均退化"
      - "Multi-Query 子查询质量随数量递增急剧下降（第 3-4 条子查询几乎无效）"
      - "PRF 伪相关反馈在两个后端上均显著退步（-10%~-11%），不推荐"
    files:
      plan: experiments/exp-002-query-rewriting.yaml
      analysis: experiments/exp-002-results-analysis.md

  - id: exp-003
    name: 多路召回 RRF 融合
    status: done
    date_range: 2026-05-20 ~ 2026-05-21
    summary: "在 exp-002 各路检索结果基础上做跨后端（Dense+BM25）RRF 融合消融，最优 4 路方案 S4（D-B0 + D-P2 + D-HyDE + B-B0）在测试集 R@50=0.6912（+13.5% vs 基线），验证异质检索器互补增益。RRF k 参数（30/60/90）对所有指标区分度极低。"
    best_result: "S4 (4 路), per-route K=50, RRF k=60, 测试集 R@50=0.6912, MRR=0.4965, Hit@50=0.8991"
    key_findings:
      - "Per-route K=50 全面碾压 K=20/30"
      - "4 路 > 3 路 > 2 路，但 5 路退步（BM25-P2 引入噪声）"
      - "RRF k=30/60/90 的 R@50 几乎无差异，固定 k=60"
      - "BM25 原查询贡献 +0.42%（边际但非零），跨后端互补增益得到证实"
      - "成本：2 次 LLM API 调用（改写 + HyDE），约 ¥0.00086/查询"
    files:
      plan: experiments/exp-003-multi-route-fusion.yaml
      analysis: experiments/exp-003-results-analysis.md

  - id: exp-004
    name: Cross-Encoder 精排模型对比
    status: done
    date_range: 2026-05-20 ~ 2026-05-22
    summary: "在 exp-003 S4 粗排 top-50 候选池上对比 5 个开源 Reranker，bge-reranker-v2-m3 测试集 NDCG@10=0.4717（+26.8% vs 粗排），MRR=0.5857（+18.0%）。gte-mul 为无数据泄露风险的干净备选（NDCG@10=0.4442）。qwen3-rerank 和 mxbai-v2 对中文精排完全不可用。"
    best_result: "bge-reranker-v2-m3, NDCG@10=0.4717, MRR=0.5857, Recall@10=0.5339"
    key_findings:
      - "BGE 家族碾压：bge-v2-m3 > bge-base > gte-mul > qwen3-rerank > mxbai-v2"
      - "NDCG@5 提升 32.0%（精排最大价值在于把最好的排到最前面）"
      - "K=20 是最优输出深度（边际收益在 20 之后基本消失）"
      - "qwen3-rerank 和 mxbai-v2 对中文 NDCG@10 < 0.11，远低于粗排基线"
      - "BGE 存在数据泄露风险（C-MTP 训练集含 T2Ranking），gte-mul 为论文安全选择"
    files:
      plan: experiments/exp-004-reranking.yaml
      analysis: experiments/exp-004-results-analysis.md

  - id: exp-005
    name: 生成阶段评估（AI 搜索生成质量对比）
    status: in_progress
    date_range: 2026-05-21 ~ 2026-05-31
    summary: "六维两批 Judge 评估框架，5 个模型跑完（1.5B/4B-thinking/4B-nonthink/7B/qwen3-max），198 条主力 + 50 条参照。双 Judge 交叉验证完成（deepseek-reasoner + glm-4.7, 146 条, ±1 一致率 92%+）。"
    interim_best: "qwen3-max (Avg=72.7, Pass%=81.2%)，最佳本地：Qwen3-4B non-thinking (Avg=60.2, Pass%=58.6%)"
    key_findings:
      - "Qwen3-4B 全面超越 Qwen2.5-7B（+4.2 分），核心优势在引文质量（+0.37）"
      - "思考模式在 AI 搜索场景有害（-2.8 分），命中官方 RULER 结论"
      - "整合质量是所有模型天花板——qwen3-max 也未突破 4 分"
      - "qwen3-max 确立 API 上界（+12.5 分 vs 最佳本地），最大差距在用户体验（+0.47）"
      - "双 Judge ±1 一致率 0.92-1.00，Judge 体系可靠性初步验证"
    pending:
      - "跑完剩余 4 个模型（Qwen2.5-3B / GLM-4-9B / Llama-3.1-8B / DeepSeek-chat）"
      - "人机校准（50 条双人标注 → Krippendorff's α）"
      - "理想排序测试（排除检索噪声，测量生成理论上限）"
      - "统计显著性检验（bootstrap CI）"
    files:
      plan: experiments/exp-005-generation.yaml
      rubric_system: experiments/exp-005-ai-search-eval-rubric.md
      rubric_generation: experiments/exp-005-generation-stage-eval-rubric.md
      rubric_deprecated: experiments/exp-005-generation-eval-rubric-v1-deprecated.md
      interim_results: experiments/exp-005-interim-results.md
      improvement_suggestions: experiments/exp-005-improvement-suggestions.md

  - id: exp-006
    name: 多轮检索 + Gap 分析改写
    status: done
    date_range: 2026-05-27
    summary: "在 exp-003 S4 最优粗排（4 路 RRF，R@50=0.6912）基础上，通过 DeepSeek API gap analysis 分析 Round 1 Top-10 检索缺口、生成 1 条改写查询、Round 2 Dense 检索（m3e-base）后做平权 RRF 融合。全量 912 条测试集 R@50=0.6989（+0.77pp），Hit@50=0.9002（+0.11pp）。增益正向但边际，核心归因结论：同一 embedding 空间内 query 改写的天花板已近，真正瓶颈是 embedding 空间本身。为 exp-007 微调提供了动机。"
    best_result: "Round 1+2 RRF: R@50=0.6989 (+0.77pp), Hit@50=0.9002 (+0.11pp)"
    key_findings:
      - "Gap analysis + 改写查询方向正确，全量正向增益 +0.77pp Recall@50"
      - "跨模型 RRF 融合（bge-small Round2 + m3e-base Round1）会产生 +3pp 伪增益，不同 embedding 空间不可混用"
      - "Phase 1（200 条）+1.59pp → Phase 2（912 条）+0.77pp，小样本放大好 case"
      - "Hit@50 几乎不变（+0.11pp），改写查询与 Round 1 三路 Dense 覆盖高度重叠"
      - "核心归因：强多路 Dense 融合基线下，首次 gap analysis 改写增益 ≤1pp，embedding 微调是下一步更高效的方向"
    cost: "912 次 API 调用 ≈ ¥4.5，无额外检索成本"
    files:
      plan: experiments/exp-006-multi-round-retrieval.yaml
      analysis: experiments/exp-006-results-analysis.md

  - id: exp-007
    name: Embedding 模型微调
    status: done (Phase 1 + 3.2)
    date_range: 2026-05-27 ~ 2026-05-30
    summary: "三阶段渐进式微调 M3E-base：Phase 1 MNRL 验证基线提升（R@10 0.3896→0.4539, +16.5%），Phase 3.1 CachedMNRL 废弃（过拟合-1.5%），Phase 3.2 Dynamic Hard Negative Mining + TripletLoss + LoRA 将 R@10 推至 0.5064（+30.0% vs pretrained, +11.6% vs Phase 1），R@50=0.7452, MRR=0.5549，全 8 项指标一致正向。三 epoch 重挖掘边际收益为零，ep1 已收敛。Phase 2（多输入对齐）pending。"
    best_result: "Phase 3.2 ep1 (Hard Negatives + TripletLoss): R@10=0.5064, R@50=0.7452, MRR=0.5549"
    best_model: "models/m3e-base-t2ranking-phase3-2/ep1/merged/"
    key_findings:
      - "Phase 1 MNRL: 744K query-positive 对 + in-batch negatives, 3 epoch → R@10 +16.5%"
      - "Phase 3.1 CachedMNRL: 已收敛模型同一份数据继续训练 → 全指标-1.5%，废弃"
      - "Phase 3.2 Hard Negatives: 1 轮 Dense 挖掘足够，ep1→ep2/3 微降（R@10 带宽仅 0.01）"
      - "LoRA（~1.2% 参数）有效防灾难性遗忘，margin=0.05 已稳定收敛"
      - "R@10 首次突破 0.50 里程碑，达到实验计划目标下限"
    pending:
      - "Phase 2: 多输入分布对齐（改写 query + HyDE 联合训练）"
    files:
      plan: experiments/exp-007-embedding-finetune.yaml
      analysis: experiments/exp-007-results-analysis.md
