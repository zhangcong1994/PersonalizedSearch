# 实验计划：混合式 DPO 中规模可行性验证
# exp-012: 1628 条 query ×（5 学生样本 + 1 教师样本）→ 自对比 + 教师辅助 DPO
# 创建日期：2026-06-03
# 最后更新：2026-06-07
#
# 背景：
#   - exp-009 SFT 两次训练均退化（-9~-10 分 vs 基线 60.2）。根因：SFT 教会模型"模仿格式"而非"跨文档整合"
#   - exp-010 Phase 1: v1-full prompt 让 8B 整合质量 +0.26（2.47→2.73），总分 64.2
#   - exp-011 可行性验证：8B-nonthink Best-of-5 = 76.54（比基线 +16.1），76% query 显著改善
#     结论 LIKELY_FEASIBLE：分布中确实存在更好的答案，RL/DPO 有望将分布推向高分区
#
#   exp-012 实际执行（2026-06-06 ~ 2026-06-07）：
#     Phase 0a — 分层抽样：从 exp-009 5000 条 train 集分层抽取 2000 条（T1/T2/T3 = 35/25/40）
#     Phase 0b — 教师生成：qwen3.6-plus + v1-full prompt → 1997 条教师答案，84.0 均分
#     Phase 1  — 学生多样本：Qwen3-8B-nonthink + v1-full, T=0.8, n=5 → 8140 条
#     Phase 2  — Judge 评分：deepseek-chat, 6 维两批 → 学生 8132 条 + 教师 1995 条评分完成
#     Phase 2a — 数据合并：学生 5 条 + 教师 1 条 → 1628 query × 6 samples
#     Phase 3  — DPO 对构造：best_vs_worst / best_vs_first_below / first_below_mean, gap>=10/15, chosen>=70
#
# 核心假设：
#   DPO 通过"好答案 vs 坏答案"的对比学习，能让模型学会"好答案长什么样、坏答案长什么样"，
#   而不像 SFT 那样机械背诵格式。教师答案与学生的 5 个样本同台竞争，谁 Judge 分高谁做 chosen。
#
# 与已有实验的关系：
#   - exp-009 → 提供 5000 条 train 集检索结果（复用检索管道，不做新检索）
#   - exp-010 → 提供 v1-full prompt（训练和评估统一使用）
#   - exp-011 → 提供多样本生成模板和 Judge pipeline
#   - exp-012 自身 → DPO 训练 + dev 集评估

meta:
  experiment_id: exp-012
  phase: "V1"
  objective: "利用 train 集 1628 条 query 构造自对比 + 教师辅助 DPO 对，在 Qwen3-8B-nonthink 上做 QLoRA DPO 微调，验证 DPO 在 AI 搜索生成场景的有效性"
  status: data_ready
  target_platform: "AutoDL RTX 4090 24GB（或更高 VRAM 服务器）"
  prerequisite:
    - "exp-009: 5000 条 train 集检索结果已生成（exp009_reranked_top10.jsonl + exp009_sampled_queries.jsonl）"
    - "exp-010: v1-full prompt 已验证（8B 整合 +0.26, 总分 64.2）"
    - "exp-011: 多样本生成 + Judge pipeline 已验证可用"
    - "exp-012 数据准备全部完成：教师答案 + 学生多样本 + Judge 评分 + DPO 对均已就绪"
    - "exp-005 评估体系已验证（deepseek-chat Judge, 6 维两批, 198 条 dev 集）"
    - "Qwen3-8B 可通过 vLLM 服务访问用于评估推理"
  design_principle: "谁分高谁做 chosen —— 学生 5 样本 + 教师 1 样本在统一 Judge 下竞争，不做分层区分"
  key_references:
    - "exp-011: 8B-nonthink Best-of-5=76.54 vs baseline(T=0.3)=60.48"
    - "exp-012 教师: qwen3.6-plus + v1-full 均分 84.0, 整合 3.26, 引文 3.08, 准确 3.60"
    - "exp-012 学生: 8B-nonthink + v1-full T=0.8 n=5, 均分 68.6, Best-of-5 76.9"
    - "exp-012 合并: Best-of-all 85.4, Gap(best-worst) 27.5, Per-query std 7.4"
    - "exp-010 Phase 1: v1-full 8B-nonthink 整合 2.73, 总分 64.2"
    - "exp-009: SFT 退化根因 —— 整合 −0.37, 引文 −0.36, 用户体验 −0.45"
    - "DPO (Rafailov et al., 2023): 偏好对直接优化策略模型，无需 reward model"
    - "Zephyr (Tunstall et al., 2023): 7B + 自模型 best-vs-worst → AlpacaEval 超 70B"


# =============================================================================
# 第一部分：动机
# =============================================================================

motivation:

  why_dpo_now:
    sft_failed_but_dpo_is_different: |
      exp-009 SFT 失败的核心原因：SFT 教"答案长什么样"，模型学会的是格式模仿而非能力习得。
      DPO 与 SFT 的本质区别：
      - SFT: 最大化 P(answer|prompt) —— "用最大似然背下答案"
      - DPO: 最大化 P(chosen|prompt) / P(rejected|prompt) —— "理解好答案和坏答案的边界"
      在 AI 搜索场景中，"好答案"不是一种固定的格式，DPO 的 contrastive 范式天然适合。

    large_scale_enabled: |
      exp-011 已验证可行性（Best-of-5 +16 分）但只有 50 条 query。
      exp-012 扩展到 train 集 1628 条 query（exp-009 5000 条中分层抽样 2000 条，
      其中 T1 700、T2 500、T3 800），数据量足够给出统计显著结论。

    teacher_as_competitor: |
      不再做"教师 vs 学生"或"纯自对比"的二元选择。
      教师答案（qwen3.6-plus + v1-full, 均分 84.0）与学生 5 个样本同台竞争，
      同一个 Judge 下谁分高谁做 chosen。T3 层（无相关 passage）教师提供正确拒答范式，
      T1/T2 层学生凭自身实力竞争。

  what_this_experiment_does_not_do:
    - "不做 SFT 初始化（exp-009 已证明有害）"
    - "不做 thinking 模式 DPO（训练复杂、推理成本高）"
    - "不修改 prompt（固定 v1-full）"
    - "不修改评估体系（固定 exp-005 Judge, 6 维两批, 198 条 dev 集）"


# =============================================================================
# 第二部分：数据 Pipeline（已全部完成）
# =============================================================================

data_pipeline:

  overview: |
    阶段 0a（分层抽样训练集）→ 阶段 0b（教师生成）→ 阶段 1（学生多样本生成）
    → 阶段 2（Judge 评分）→ 阶段 2a（合并）→ 阶段 3a（DPO 对构造）
    → 阶段 3b（验证集分层抽样）→ 阶段 3c（验证集基线生成+评分）
    → 阶段 4（DPO 训练）→ 阶段 5（验证集 DPO 推理+评分）→ 阶段 6（配对对比分析）

  # ─────────────────────────────────────────────────────────
  # 阶段 0a：分层抽样
  # ─────────────────────────────────────────────────────────

  stage_0a_sampling:
    status: DONE
    script: "scripts/exp012/sample_exp009_queries.py"
    input:
      - "data/processed/exp009_sampled_queries.jsonl（5000 条，含 T1/T2/T3 strata）"
      - "data/processed/exp009_reranked_top10.jsonl（5000 条检索结果）"
    output: "data/processed/exp012_sampled_queries.jsonl（2000 条）"
    strata:
      - {stratum: "T1 富信息 (np>=3)", count: 700, pct: "35%", np_mean: 5.27}
      - {stratum: "T2 中等 (np=1-2)", count: 500, pct: "25%", np_mean: 1.31}
      - {stratum: "T3 贫信息 (np=0)", count: 800, pct: "40%", np_mean: 0.00}
    note: "T3 过采样至 40%（自然占比 22%），确保拒答场景充分覆盖"

  # ─────────────────────────────────────────────────────────
  # 阶段 0b：教师生成
  # ─────────────────────────────────────────────────────────

  stage_0b_teacher:
    status: DONE
    script: "scripts/exp009/generate_teacher_answers.py（改造版）"
    model: "qwen3.6-plus"
    prompt: "v1-full"
    temperature: 0.3
    input: "data/processed/exp012_sampled_queries.jsonl（2000 条）"
    output: "data/processed/exp012_teacher_answers.jsonl（1997 条）"
    quality:
      avg_score: 84.0
      pass_rate: "98.6%"
      synthesis_quality: 3.26
      citation_quality: 3.08
      veracity: 3.60
      user_experience: 3.95
      grades: "S 24%, A 44%, B 28%, C 3%, D 1.5%"
    modifications_to_script:
      - "MODEL_ID 改为 --model 参数，支持 qwen3.6-plus"
      - "prompt 从 v0 改为 --prompt-version 参数，支持 v1-full"
      - "load_reranked() 自动适配 exp-012 格式（query_id/query_text/passages）"

  # ─────────────────────────────────────────────────────────
  # 阶段 1：学生多样本生成
  # ─────────────────────────────────────────────────────────

  stage_1_student:
    status: DONE
    script: "scripts/exp011/generate_multi_sample.py（改造版）"
    model: "Qwen3-8B-nonthink"
    prompt: "v1-full"
    temperature: 0.8
    num_samples: 5
    input: "data/processed/exp012_sampled_queries.jsonl（2000 条, sample_size=0 启用全量）"
    output: "results/exp012/generation/qwen3-8b-nothink_v1-full_t0.8_n5_s42.jsonl（8140 条, 1628 query × 5）"
    modifications_to_script:
      - "新增 --input-file 参数（自定义输入 JSONL）"
      - "新增 --output-dir 参数（自定义输出目录）"
      - "sample_size=0 时使用全量输入"

  # ─────────────────────────────────────────────────────────
  # 阶段 2：Judge 评分
  # ─────────────────────────────────────────────────────────

  stage_2_judge:
    status: DONE
    script: "scripts/exp011/run_judge.py"
    judge_model: "deepseek-chat"
    concurrency: 10
    results:
      student:
        records: 8132
        output: "results/exp012/judge_scores/qwen3-8b-nothink_v1-full_t0.8_n5_s42_judged.jsonl"
        avg_score: 68.6
        best_of_5: 76.9
        mean_of_5: 68.6
        per_query_std: 7.4
        dimensions: {veracity: 3.15, safety: 3.65, relevance: 3.74, synthesis: 2.67, citation: 2.70, ux: 3.52}
        grades: "S 21%, A 39%, B 12%, C 20%, D 7%, F 1.5%"
      teacher:
        records: 1995
        output: "results/exp012/judge_scores/qwen3.6-plus-teacher_v1-full_judged.jsonl"
        avg_score: 84.0
        dimensions: {veracity: 3.60, safety: 3.89, relevance: 3.98, synthesis: 3.26, citation: 3.08, ux: 3.95}
        grades: "S 24%, A 44%, B 28%, C 3%, D 1.5%, F 0%"

  # ─────────────────────────────────────────────────────────
  # 阶段 2a：学生 + 教师合并
  # ─────────────────────────────────────────────────────────

  stage_2a_merge:
    status: DONE
    script: "scripts/exp012/merge_teacher_student.py"
    principle: "教师答案作为第 6 个 candidate sample，与该 query 下学生的 5 个样本同 Judge 竞争"
    outputs:
      gen: "results/exp012/generation/qwen3-8b-plus-teacher_v1-full_t0.8_n5+1_s42.jsonl（9767 条）"
      judge: "results/exp012/judge_scores/qwen3-8b-plus-teacher_v1-full_t0.8_n5+1_s42_judged.jsonl（9757 条）"
    per_query: "1628 query: 1627 条含 6 samples（5 学生 + 1 教师），1 条含 5 samples"
    merged_stats:
      best_of_all: {mean: 85.4, median: 85.2, P25: 75.9, P75: 94.4}
      mean_of_all: {mean: 71.2, median: 75.6}
      worst_of_all: {mean: 57.8, median: 66.7}
      gap_best_worst: {mean: 27.5, median: 24.0, P25: 13.0, P75: 37.8}
    best_source_breakdown:
      T1: "教师 57% vs 学生 43%"
      T2: "教师 57% vs 学生 43%"
      T3: "教师 78% vs 学生 22%"
      overall: "教师 65% vs 学生 35%"
    teacher_ranking: "Rank 1: 65%, Rank 2: 10%, Rank 3-6: 各 5-6%"


# =============================================================================
# 第三部分：DPO 数据构造
# =============================================================================

dpo_pair_construction:

  script: "scripts/exp012/construct_dpo_pairs.py"
  input:
    generation: "results/exp012/generation/qwen3-8b-plus-teacher_v1-full_t0.8_n5+1_s42.jsonl"
    judge: "results/exp012/judge_scores/qwen3-8b-plus-teacher_v1-full_t0.8_n5+1_s42_judged.jsonl"
  output_dir: "data/processed/exp012/"

  global_filter_chosen_score: ">= 70"

  strategies:

    - id: "best_vs_worst"
      description: "每个 query 取最高分做 chosen，最低分做 rejected"
      rationale: "基线策略，对比度最大。作为对照：如果这个策略的 rejected 太差（<55 分），更换策略"
      gap_thresholds: [10, 15]
      yields:
        gap10: 1212 pairs
        gap15: 1022 pairs
      quality:
        gap10: {chosen_mean: 86.8, rejected_mean: 55.3, gap_mean: 31.5}
        gap15: {chosen_mean: 86.8, rejected_mean: 52.1, gap_mean: 34.8}
      note: "rejected 偏弱（~52-55），gap > 30 有过拟合风险。作为消融对照，不作为主实验"

    - id: "best_vs_first_below"
      description: "最高分做 chosen，第一个比它低够 min_gap 分的做 rejected"
      rationale: "纯 gap 驱动，不考虑 mean。保证对比度 ≥ min_gap"
      gap_thresholds: [10, 15]

    - id: "first_below_mean"
      description: "最高分做 chosen，第一个低于该 query 均分的做 rejected"
      rationale: "业界推荐甜点——rejected 是'还可以但不够好'的水平，非'完全错误'"
      gap_thresholds: [10, 15]
      yields:
        gap10: 1054 pairs
        gap15: 834 pairs
      quality:
        gap10: {chosen_mean: 87.3, rejected_mean: 59.9, gap_mean: 27.4}
        gap15: {chosen_mean: 87.1, rejected_mean: 56.2, gap_mean: 30.9}
      recommendation: "主实验用 gap10（1054 对），gap15（834 对）做消融"

  quality_validation:
    checks:
      - "chosen/rejected 文本不同（自动检查，已内置）"
      - "length ratio 1.18-1.27（全部在安全范围，无长度 exploitation 风险）"
      - "same-text skipped: 112 对（best_vs_worst），0 对（first_below_mean）"


# =============================================================================
# 第四部分：模型与训练配置
# =============================================================================

model_selection:

  base_model:
    id: "Qwen3-8B"
    hf_id: "Qwen/Qwen3-8B"
    backend: "transformers + bitsandbytes (QLoRA)"
    thinking: "OFF"
    starting_checkpoint: "Qwen/Qwen3-8B 原始权重（不做 SFT 初始化）"
    why_no_sft_init: |
      exp-009 证明 SFT 初始化会让模型退化（整合 −0.37、引文 −0.36）。
      DPO 应从干净的基座模型开始，让 preference signal 直接塑造行为。

  prompt_version: "v1-full"
  prompt_consistency: "训练和评估使用相同的 prompt（v1-full），与 exp-010 Phase 1 一致"


training:

  script: "scripts/exp012/train_dpo.py"
  method: "QLoRA + DPO"

  lora_config:
    r: 8
    alpha: 16
    dropout: 0.1
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    quantization: "4-bit NF4（bitsandbytes）"

  dpo_config:
    beta: 0.1
    loss_type: "sigmoid"
    max_length: 7168
    max_prompt_length: 6144

  hyperparameters:
    epochs: 1
    learning_rate: 5e-5
    optimizer: "adamw_8bit"
    per_device_batch_size: 2
    gradient_accumulation_steps: 2
    effective_batch_size: 4

  framework: "trl.DPOTrainer"

  primary_run:
    train_file: "data/processed/exp012/exp012_dpo_first_below_mean_gap10.jsonl"
    pairs: 1054
    estimated_time: "~2 小时（RTX 4090）"
    estimated_vram: "~14-18 GB"

  ablation_runs:
    - {train_file: "exp012_dpo_first_below_mean_gap15.jsonl", pairs: 834, purpose: "更严格 gap 消融"}
    - {train_file: "exp012_dpo_best_vs_worst_gap10.jsonl", pairs: 1212, purpose: "worst-rejected 对照"}


# =============================================================================
# 第五部分：评估
# =============================================================================

evaluation:

  validation_set:
    description: "从 exp-009 剩余 3000 条中分层抽样，与训练集同分布但无重叠"
    script: "scripts/exp012/sample_validation_queries.py"
    input:
      pool: "data/processed/exp009_sampled_queries.jsonl（5000 条）"
      reranked: "data/processed/exp009_reranked_top10.jsonl"
      exclude: "data/processed/exp012_sampled_queries.jsonl（已用于训练）"
    output: "data/processed/exp012_validation_queries.jsonl（300 条）"
    strata:
      - {stratum: "T1 富信息", count: 105, pct: "35%", np_mean: 5.18}
      - {stratum: "T2 中等", count: 75, pct: "25%", np_mean: 1.31}
      - {stratum: "T3 贫信息", count: 120, pct: "40%", np_mean: 0.0}
    seed: 123

  evaluation_design:
    approach: "配对对比（Paired Comparison）"
    principle: |
      基线 8B 和 DPO 后 8B 在相同 300 条 query 上各生成 1 条回答（T=0.3），
      同一 Judge 评分后做 per-query diff 分析。这样可以控制 query 难度差异，
      提升统计显著性（300 对 paired t-test 远比 300 条独立样本敏感）。
    metrics:
      - "Δ 总分均值（DPO - 基线）及 95% CI"
      - "Δ > 0 的 query 占比（win rate）"
      - "Δ < 0 的 query 占比（regression rate）"
      - "各维度 Δ 均值"
      - "按 strata (T1/T2/T3) 分组的 Δ"
      - "paired t-test p-value"

  generation:
    prompt: "v1-full（与训练时一致）"
    temperature: 0.3
    num_samples: 1
    models:
      - "Qwen3-8B-nonthink（基座，不做任何微调）→ baseline"
      - "Qwen3-8B-nonthink + exp012 LoRA adapter（DPO 后）→ dpo"

  judge:
    judge_model: "deepseek-chat"
    protocol: "6 维两批（exp-005 标准），Batch1: 准确性+安全性+相关性, Batch2: 整合+引文+体验"
    total_calls: "300 query × 2 models × 2 batches = 1200 次"
    estimated_cost: "~¥1-2"

  comparison_baselines:
    - model: "Qwen3-8B-nonthink + v1-full（DPO 训练前基线）"
      score: 64.2
      source: "exp-010 Phase 1 dev 集"
    - model: "qwen3.6-plus-teacher + v1-full（教师）"
      score: 84.0
      source: "exp-012 train 集 Judge"
    - model: "8B-nonthink + v1-full, T=0.8, Best-of-5（训练数据内）"
      score: 76.9
      source: "exp-012 train 集 Judge"
    - model: "qwen3-max + v0 prompt（API 上界）"
      score: 72.7
      source: "exp-005 dev 集"



# =============================================================================
# 第六部分：成功判定与决策树
# =============================================================================

success_criteria:

  level_strong:
    condition: "DPO 后总分 >= 70（比基线 +5.8 以上），且整合质量 >= 2.80"
    decision: "DPO 路线强验证。扩展到 5000+ 条大规模 DPO（exp-013），考虑 thinking 模式 DPO。"
    note: "1054 对 DPO 拿 5.8 分 = 极强边际收益"

  level_good:
    condition: "DPO 后总分 >= 66（比基线 +1.8 以上），且整合质量 >= 2.75"
    decision: "DPO 路线证实有效。扩展数据量（2-3K），调优 beta/lr 等超参。"
    note: "1.8 分相当于 exp-010 整个 prompt 工程收益，DPO 单轮达到 = 方法有效"

  level_marginal:
    condition: "DPO 后总分在 64.2 ± 1.5 范围内"
    decision: "信号弱。尝试消融（不同策略/beta），如果无效则考虑加大模型而非 DPO。"

  level_failure:
    condition: "DPO 后总分下降超过 2 分，或整合质量显著退化"
    decision: "DPO 不适合该场景。停止探索，回归 prompt 工程或换更大模型。"
    note: "快速失败也是成功"


# =============================================================================
# 第七部分：执行步骤
# =============================================================================

execution_plan:

  # ── 步骤 0a~3d 已完成 ──
  completed:
    - step: "0a. 分层抽样 2000 条训练集"
    - step: "0b. 教师生成（qwen3.6-plus + v1-full）"
    - step: "1. 学生多样本生成（8B, T=0.8, n=5）"
    - step: "2. Judge 评分（学生 + 教师，deepseek-chat, 10 并发）"
    - step: "2a. 学生 + 教师合并"
    - step: "3a. DPO 对构造（4 种策略 × 2 gap = 8 个文件）"
    - step: "3b. 验证集分层抽样 300 条（剩余 T1 105 + T2 75 + T3 120, seed=123）"
    - step: "3c. 验证集基线生成（8B + v1-full, T=0.3, n=1）→ 300 条"
    - step: "3d. 验证集基线 Judge 评分 → 300 条已评分"

  # ── 待执行 ──
  pending:
    - step: "4a. DPO 训练 - 主实验"
      command: "python scripts/exp012/train_dpo.py --train-file data/processed/exp012/exp012_dpo_first_below_mean_gap10.jsonl --output-dir models/exp012/ --beta 0.1 --lr 5e-5"
      key_params: {train_file: "first_below_mean_gap10", pairs: 1054}

    - step: "4b. DPO 训练 - 消融"
      commands:
        - "python scripts/exp012/train_dpo.py --train-file data/processed/exp012/exp012_dpo_first_below_mean_gap15.jsonl --output-dir models/exp012_gap15/ --beta 0.1 --lr 5e-5"
        - "python scripts/exp012/train_dpo.py --train-file data/processed/exp012/exp012_dpo_best_vs_worst_gap10.jsonl --output-dir models/exp012_worst/ --beta 0.1 --lr 5e-5"

    - step: "5a. 验证集 DPO 模型推理"
      script: "复用 exp-011 的 vLLM 生成 pipeline"
      model: "Qwen3-8B + exp012 LoRA adapter"
      input: "data/processed/exp012_validation_queries.jsonl（300 条）"
      prompt: "v1-full, T=0.3, n=1"
      output: "results/exp012/generation/validation/qwen3-8b-dpo_v1-full_t0.3_n1_s0.jsonl"

    - step: "5b. 验证集 DPO 模型 Judge 评分"
      script: "复用 exp-011 的 Judge pipeline"
      input: "step 5a 输出 + step 3c 基线回答"
      judge_model: "deepseek-chat, 6 维两批, 300 条 × 2 batches"

    - step: "6. 配对对比分析"
      script: "scripts/exp012/analyze_paired.py"
      input:
        - "baseline: results/exp012/judge_scores/validation/qwen3-8b-nothink_v1-full_t0.3_n1_s0_judged.jsonl"
        - "dpo: results/exp012/judge_scores/validation/qwen3-8b-dpo_v1-full_t0.3_n1_s0_judged.jsonl"
      analysis:
        - "per-query Δ 总分 (DPO - baseline)"
        - "95% CI + paired t-test"
        - "win rate / regression rate"
        - "per-dimension Δ"
        - "per-stratum (T1/T2/T3) Δ"


# =============================================================================
# 第八部分：风险与局限
# =============================================================================

risks_and_limitations:

  risks:
    - risk: "教师答案占比过高（65% 的 query 教师当选 chosen），DPO 可能偏到教师风格"
      likelihood: 中等
      mitigation: "消融实验 best_vs_worst_gap10 不含教师选择偏置（只选学生内部 best），作为对照"

    - risk: "best_vs_worst 策略 gap > 30 导致 overfitting"
      likelihood: 中高
      mitigation: "主实验用 first_below_mean（gap 27.4），已触预警线但可接受。必要时增大 beta 到 0.3"

    - risk: "DPO 与 SFT 一样导致'退化到简单行为'"
      likelihood: 低
      mitigation: "6 维分项评估能捕获——总分涨但整合跌 = reward hacking"

    - risk: "训练集查询与 dev 集查询存在分布差异"
      likelihood: 低
      mitigation: "两套数据来自 T2Ranking 同一语料源的不同 split，检索管道相同。且 1628 条足够覆盖各种查询类型"

  limitations:
    - "本实验用 train 集做 DPO 数据，dev 集做评估。train/dev 来自同一语料源但不同 query split，理论上不存在数据泄露"
    - "QLoRA（1.2% 参数）限制了 DPO 效果上限，全参数 DPO 可能有更大收益但需 A100"
    - "未比较 DPO vs GRPO/PPO 等在线 RL 方法"
    - "仅验证 8B 模型，4B 的 DPO 效果可能不同"
