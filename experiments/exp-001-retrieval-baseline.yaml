# 实验计划：V0 检索能力基准评估
# exp-001: BM25 vs Dense 检索 + 嵌入模型对比 + Hybrid 融合
# 创建日期: 2026-05-17

meta:
  experiment_id: exp-001
  phase: V0
  objective: "建立多层检索基线，通过消融实验量化分片策略、嵌入模型、检索策略对检索质量的影响"
  status: planned
  target_platform: "AutoDL (RTX 4090 24GB)"


# =============================================================================
# 第一部分：背景 —— 当前系统各模块实现状态
# =============================================================================

background:

  # ---------- 查询重写 ----------
  query_rewriting:
    status: "关键词匹配分流，非真正重写"
    implementation:
      file: "src/generation/prompts.py"
      class: "PromptManager.classify_query_type()"
      mechanism: "关键词白名单匹配"
      mapping:
        - "什么时候/多少/谁/哪里/哪一年 → factual"
        - "区别/对比/不同/差异/哪个更好 → comparison"
        - "什么是/定义/概念/解释/原理 → concept"
        - "发展趋势/影响/未来/前景 → open_discussion"
        - "（以上都不匹配）→ default"
    purpose: "选择不同的 System Prompt 模板（factual/concept/comparison/open_discussion 各有专用 few-shot 模板）"
    what_it_does_not_do: "不改变用户输入的查询文本，不展开缩写，不补充上下文"
    v1_plan: "先用 DeepSeek API 做轻量重写（few-shot prompt 展开短查询），V1 后期部署本地重写模型（如 Qwen2.5-7B-Instruct）"

  # ---------- 意图识别 ----------
  intent_recognition:
    status: "关键词匹配分类，无真实意图理解"
    implementation:
      file: "src/generation/prompts.py"
      class: "PromptManager.classify_query_type()"
      mechanism: "关键词白名单匹配 → 选择对应 System Prompt"
      categories:
        - factual: "精确事实型回答模板（先给答案 → 2-3句补充 → 标注来源）"
        - concept: "概念解释模板（核心定义 → bullet points → 标来源）"
        - comparison: "对比分析模板（基本情况 → 表格 → 场景建议）"
        - open_discussion: "开放讨论模板（综述 → 多角度展开 → 总结）"
        - default: "通用知识库问答模板"
    evaluation_implication: "对检索评估（Recall@k/MRR/NDCG）无影响——检索发生在意图识别之前，意图识别只影响生成阶段的 Prompt 选择"
    v1_plan: "利用 T2Ranking query types 训练真实意图分类器；V1.5 引入查询重写增强搜索词"

  # ---------- LLM 生成 ----------
  llm_generation:
    status: "DeepSeek API 调用，模板化 Prompt"
    implementation:
      files:
        - "src/generation/generator.py"   # 核心生成逻辑
        - "src/generation/prompts.py"    # Prompt 模板管理
      model: "deepseek-chat (API)"
      temperature: 0.3
      max_tokens: 1024
      max_context_chars: 3000
      context_trimming: "按字符数截断，先到先得，保留至少 200 字符的文档"
      prompt_structure:
        system: "按查询类型选择 System Prompt（含 few-shot 示例）"
        human: "参考资料:\n{format_context}\n\n用户问题: {question}\n\n请根据以上参考资料回答问题："
      streaming: "支持（generate_stream 方法）"
    cost_per_query: "~500-1000 output tokens ≈ ¥0.001-0.002/查询"
    evaluation_implication: "检索评估无需调 LLM 生成，保留 API 额度用于查询重写实验"


# =============================================================================
# 第二部分：评估数据
# =============================================================================

evaluation_data:

  source:
    name: "T2Ranking (SIGIR 2023)"
    split: "dev"
    queries_file: "data/raw/t2ranking/queries.dev.tsv"
    qrels_file: "data/raw/t2ranking/qrels.retrieval.dev.tsv"
    collection_file: "data/raw/t2ranking/collection.tsv"

  scale:
    total_queries: 24832
    queries_with_qrels: 22812   # 有 qrels 的查询数（约 8% 查询无标注）
    total_qrels_pairs: 118932   # qid-pid 标注对总数
    unique_passages_in_collection: 2303643   # 全部 passage
    avg_qrels_per_query: 5.2    # 每条查询平均 ~5.2 个相关 passage

  sampling_analysis:
    rationale: "首次实验用抽样验证脚本正确性，消融实验用中等规模确认趋势，最终配置用全量出论文级指标"
    tiers:
      - name: "快速验证 (smoke test)"
        sample_size: 100
        purpose: "验证评估脚本 + BM25 + Dense 全链路无报错"
        cost: ~¥0   # API 调用极少量，不计
        time_on_gpu: ~2 分钟
      - name: "消融实验 (ablation)"
        sample_size: 2000
        purpose: "对比不同嵌入模型、分片策略，得出统计显著的排序"
        cost: ~¥0.6 （仅查询重写 API）
        time_on_gpu: ~15 分钟
      - name: "最终报告 (full)"
        sample_size: 22812  # 全量
        purpose: "产出论文级最终数字"
        cost: ~¥7 （仅查询重写 API）
        time_on_gpu: ~45 分钟

  api_cost_detail:
    deepseek_pricing:
      input: "¥1 / 1M tokens"
      output: "¥2 / 1M tokens"
    query_rewriting_per_query:
      input_tokens: 200   # few-shot prompt + 原始查询
      output_tokens: 50   # 重写后查询
      cost: "¥0.0003"
    llm_generation_per_query:
      note: "检索评估不需要 LLM 生成，仅查询重写实验需要"
    total_cost_breakdown:
      ablation_2000: "2000 × ¥0.0003 = ¥0.6"
      full_22812: "22812 × ¥0.0003 ≈ ¥7"
      conclusion: "成本极低，无需担心 API 费用"


# =============================================================================
# 第三部分：评估指标
# =============================================================================

metrics:

  core:
    - name: "Recall@k"
      formula: "|Retrieved_k ∩ Relevant| / |Relevant|"
      k_values: [1, 3, 5, 10]
      focus: "召回能力 —— '找到了吗？'"
    - name: "MRR (Mean Reciprocal Rank)"
      formula: "(1/N) × Σ 1/rank_of_first_relevant"
      focus: "排序质量 —— '排在最前面了吗？'"
    - name: "NDCG@k"
      formula: "DCG@k / IDCG@k，其中 DCG = Σ (2^rel_i - 1) / log2(i+1)"
      k_values: [5, 10]
      focus: "考虑相关性等级的排序质量 —— '高相关排在前面了吗？'"
      note: "T2Ranking 的 4 级标注使 NDCG 成为核心亮点指标"

  auxiliary:
    - name: "Hit@k"
      formula: "至少命中 ≥1 个相关文档的查询比例"
      focus: "粗粒度成功率"
    - name: "Precision@k"
      formula: "|Retrieved_k ∩ Relevant| / k"
      focus: "检索效率 —— '返回结果中有多少是相关的？'"

  generation_metrics:
    note: "V0 检索评估不包含生成指标。生成质量评估（LLM-as-a-judge）留到 V0.3/V1"


# =============================================================================
# 第四部分：实验分组
# =============================================================================

experiment_groups:

  # ========== 实验组 1：嵌入模型对比 ==========
  embedding_model_comparison:
    objective: "在相同分片策略和检索方式下，对比不同嵌入模型对语义检索（B1）的影响"
    fixed:
      dataset: "T2Ranking 全量 passages（230 万）"
      chunk_strategy: "不分片（passage 即检索单元）"
      retrieval_strategy: "similarity（余弦相似度检索）"
      top_k: 10

    groups:
      - id: "E1-M1"
        name: "bge-small-zh-v1.5 (baseline)"
        model: "BAAI/bge-small-zh-v1.5"
        dim: 512
        local_model_size: "~100MB"
        index_build_time_gpu: "~5 min"
        rationale: "当前基线，最小最快"

      - id: "E1-M2"
        name: "bge-large-zh-v1.5"
        model: "BAAI/bge-large-zh-v1.5"
        dim: 1024
        local_model_size: "~1.3GB"
        index_build_time_gpu: "~15 min"
        rationale: "bge 系列最强中文模型，预期效果最好但慢 3×"

      - id: "E1-M3"
        name: "m3e-base"
        model: "moka-ai/m3e-base"
        dim: 768
        local_model_size: "~400MB"
        index_build_time_gpu: "~10 min"
        rationale: "中文社区广泛使用，需验证与 bge 的差距"

      - id: "E1-M4"
        name: "bge-m3"
        model: "BAAI/bge-m3"
        dim: 1024
        local_model_size: "~2.2GB"
        index_build_time_gpu: "~20 min"
        rationale: "多语言模型，支持中英混合查询，可选实验"

    comparison_matrix:
      rows: ["Recall@1", "Recall@5", "Recall@10", "MRR", "NDCG@5", "NDCG@10", "Build Time", "Embed Time/q"]
      columns: ["E1-M1 (bge-small)", "E1-M2 (bge-large)", "E1-M3 (m3e-base)", "E1-M4 (bge-m3)"]

  # ========== 实验组 2：检索策略对比 ==========
  retrieval_strategy_comparison:
    objective: "在最优嵌入模型上，对比不同检索策略对 Top-K 结果质量的影响"
    fixed:
      dataset: "T2Ranking 全量 passages（230 万）"
      chunk_strategy: "不分片"
      embedding_model: "E1 中最优模型（预期 bge-large）"
      top_k: 10

    groups:
      - id: "E2-S1"
        name: "similarity (baseline)"
        method: "余弦相似度检索"
        langchain_keyword: "similarity"
        rationale: "当前默认，最直接的语义检索"

      - id: "E2-S2"
        name: "MMR (Max Marginal Relevance)"
        method: "最大边际相关：平衡相关性与多样性"
        langchain_keyword: "mmr"
        parameters: "fetch_k=20, lambda_mult=0.5（可调）"
        rationale: "预期在开放型查询上减少冗余，比 similarity 更适合需要覆盖多角度的查询"
        hypothesis: "对比型/开放型查询 Recall 提升，事实型查询可能持平或略降"

      - id: "E2-S3"
        name: "Similarity + Score Threshold"
        method: "相似度阈值过滤：只返回高于阈值的文档"
        langchain_keyword: "similarity_score_threshold"
        parameters: "score_threshold=0.3（可调）"
        rationale: "过滤低质量检索结果，减少噪音"

    comparison_matrix:
      rows: ["Recall@1", "Recall@5", "Recall@10", "MRR", "NDCG@5", "NDCG@10"]
      columns: ["E2-S1 (similarity)", "E2-S2 (MMR)", "E2-S3 (threshold)"]

  # ========== 实验组 3：Hybrid 融合策略对比（BM25 + Dense）==========
  hybrid_fusion_comparison:
    objective: "验证 BM25 + Dense 混合检索（B2）相比纯 Dense（B1）的增益，并对比不同融合方式"
    fixed:
      dataset: "T2Ranking 全量 passages（230 万）"
      chunk_strategy: "不分片"
      embedding_model: "E1 中最优模型"
      top_k: 10

    groups:
      - id: "E3-B0"
        name: "BM25 only"
        method: "纯关键词倒排索引"
        implementation: "rank_bm25.BM25Okapi"
        rationale: "传统 IR 下界基线，证明语义检索的必要性"

      - id: "E3-B1"
        name: "Dense only"
        method: "纯向量相似度检索（复用 E1/E2 最优配置）"
        rationale: "语义检索上界（单路）"

      - id: "E3-B2a"
        name: "Hybrid (RRF 融合)"
        method: "BM25 + Dense 双路召回 → RRF 融合排名"
        implementation: "langchain.retrievers.EnsembleRetriever + RRF"
        parameters: "k=60, c=60（LangChain 默认）"
        rationale: "V0 系统基线，预期 Recall 优于纯 Dense"

      - id: "E3-B2b"
        name: "Hybrid (加权分数融合)"
        method: "BM25 + Dense 双路召回 → 分数归一化 → 加权求和"
        parameters: "α (BM25权重) = 0.3, 0.5, 0.7 三档"
        rationale: "探索关键词与语义的最优权重分配，对比 RRF"

    comparison_matrix:
      rows: ["Recall@1", "Recall@5", "Recall@10", "MRR", "NDCG@5", "NDCG@10"]
      columns: ["B0 (BM25)", "B1 (Dense)", "B2a (RRF)", "B2b (weighted)"]


# =============================================================================
# 第五部分：执行计划
# =============================================================================

execution_plan:

  phase_1_preparation:
    duration: "~1 小时（服务器准备）"
    tasks:
      - "租 AutoDL RTX 4090 实例（按量，约 ¥2-3/h）"
      - "clone 项目代码 (git clone)"
      - "下载 T2Ranking 缺失的嵌入模型: bge-large-zh-v1.5, m3e-base, bge-m3"
      - "构建 T2Ranking 全量向量索引（230 万 passages × 4 模型 = 约 1 小时 GPU）"
      - "验证评估脚本一次通过（smoke test 100 条）"

  phase_2_ablation:
    duration: "~1.5 小时"
    sample_size: 2000
    tasks:
      - "E1: 嵌入模型对比（4 组 × 2000 queries ≈ 8 分钟检索 + few 分钟建索引）"
      - "E2: 检索策略对比（3 组 × 2000 queries ≈ 6 分钟）"
      - "E3: Hybrid 融合对比（4 组 × 2000 queries ≈ 10 分钟）"
      - "汇总消融结果，选择最优配置组合"

  phase_3_full_evaluation:
    duration: "~1 小时"
    sample_size: 22812  # 全量
    tasks:
      - "用最优配置跑全量评估"
      - "产出论文级指标表格"
      - "可选：按查询类型分层分析（factual/concept/comparison/open_discussion 各自指标）"

  total_server_time: "~3.5-4 小时"
  total_server_cost: "约 ¥10-15"
  total_api_cost: "约 ¥8（全量查询重写 + 极少 LLM 调用）"


# =============================================================================
# 第六部分：输出物
# =============================================================================

deliverables:

  - name: "评估指标表格"
    format: "Markdown table (写入 progress.yaml / experiments 目录)"
    content: "所有实验组在核心指标上的完整数字"

  - name: "最优配置结论"
    format: "文字总结"
    content: "推荐嵌入模型、检索策略、融合方式的组合及其理由"

  - name: "分层分析"
    format: "表格（可选）"
    content: "按查询类型分层的指标（如仅对对比型查询看 Hybrid 增益）"

  - name: "性能数据"
    format: "表格"
    content: "各模型建索引耗时、单查询检索延迟，支撑后续服务器选型"
