data:
  download:
    aol4ps_url: "https://github.com/AnnKwok/AOL4PS/raw/main/"
    save_dir: "./data/raw/aol4ps/"
    timeout: 300
    max_retries: 3
  raw_path: "./data/raw/"
  processed_path: "./data/processed/"

indexing:
  chunk_size: 256
  chunk_overlap: 20
  embedding_model: "all-MiniLM-L6-v2"
  vector_db:
    type: "chromadb"
    path: "./data/vector_db/"
    top_k: 10

intent:  # API客户端配置
  api_client:
    type: "deepseek"         # 可选: openai, deepseek
    api_key: "${DEEPSEEK_API_KEY}"  # 环境变量方式
    model: "deepseek-chat"   # DeepSeek模型名称
    max_tokens: 512          # 最大生成token数
    temperature: 0.1         # 生成温度（0-1，越低越确定，建议低温度保证一致性）
  
  # Prompt模板配置
  prompt_template: "query_rewrite_basic"  # 使用的模板名称

# 搜索检索模块配置
retrieval:
  vector_db: "chromadb"      # 可选: chromadb, faiss
  top_k: 10                  # 返回结果数量
  chunk_size: 256            # 文档切片大小
  chunk_overlap: 20          # 切片重叠大小

# LLM生成模块配置
generation:
  api_client:
    type: "openai"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-3.5-turbo"
    max_tokens: 512
    temperature: 0.7

retrieval:
  top_k: 10
  rerank_top_k: 5

generation:
  max_tokens: 1024
  temperature: 0.7

logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"