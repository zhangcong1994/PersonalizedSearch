      - "全量 230 万 passage 索引，抽样 2000 条查询"
      - "相比 bge-small (Recall@10=0.4548, MRR=0.5097)，m3e-base 各指标均低 10%+"
      - "Recall@10 差距: 0.455→0.389 (↓14%)，MRR 差距: 0.510→0.444 (↓13%)"
