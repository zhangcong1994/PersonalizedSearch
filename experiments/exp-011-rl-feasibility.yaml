# 实验计划：RL/DPO 可行性验证
# exp-011: 回答"RL 或 DPO 在本项目 AI 搜索场景下是否有前景"
# 创建日期：2026-06-03
# 最后更新：2026-06-03
#
# 背景：
#   - exp-009 SFT 两次训练均退化（-9~-10 分 vs 基线 60.2）
#   - exp-010 Prompt 工程已在进行（V0-V3 + 消融变体）
#   - SFT/DPO 对"优化行为而非模仿格式"有天然优势，但需要验证前提
#
# 核心假设：
#   如果模型多次采样（高温度）能找到比单次生成（低温度）显著更好的答案，
#   则 RL/DPO 有望将这些优质输出概率提高；否则瓶颈在模型能力上限而非训练方法。

meta:
  experiment_id: exp-011
  phase: "V1"
  objective: "通过多样本生成 + Judge 评分，验证 RL/DPO 在 AI 搜索生成场景的可行性前提"
  status: planned
  target_platform: "本地 RTX 4090 (vLLM)"
  prerequisite:
    - "exp-005 评估体系已验证（deepseek-chat Judge, 6 维两批）"
    - "exp-009 SFT 结果已出（确认 SFT 不适合，RL 是下一探索方向）"
    - "Qwen3-4B 和 Qwen3-8B 可通过 vLLM 服务访问"
  design_principle: "最简可行实验 —— 只回答一个核心问题（更好答案在分布中吗？），不搞 RL 训练本身"
  key_references:
    - "exp-005: Qwen3-4B-nothink 基线 60.2 分, Qwen3-8B-nothink 待评估"
    - "exp-009: SFT 失败根因 —— 模型学会格式而非整合，2160 条数据无法突破 4B 能力上限"
    - "RL 理论框架: 有可量化评判标准（Judge 6 维）；优化路径模糊（整合/引文/用户体验 → SFT 学不会）；存在自动 verifier（source documents）"


# =============================================================================
# 第一部分：动机 —— 为什么需要验证 RL 可行性
# =============================================================================

motivation:

  why_rl_might_work:
    sft_taught_format_not_behavior: |
      exp-009 的核心发现：SFT 教模型"模仿答案格式"而非"学会跨文档整合"。
      模型输出从基线（60.2 的合理整合）退化为"逐篇罗列原文"（51.2）。
      RL 的天然优势在于：不告诉模型"正确答案长什么样"，而是告诉模型"什么样的输出好"。
      这让模型可以探索自己的整合方式，而非背诵教师答案的格式。

    multi_sample_hypothesis: |
      AI 搜索场景下，同一个问题对同一组文档，可以有多种合理的回答方式：
      - 不同的信息组织顺序
      - 不同的详略取舍
      - 不同的表述风格
      如果 baseline（T=0.3）选中的是次优路径，那么提高温度多次采样，
      可能有部分样本的 Judge 评分更高。这就是 RL 能发挥作用的空间。

    reward_signal_exists: |
      与许多 RL 场景不同，本项目已有可靠的 reward 信号来源：
      - exp-005 Judge（deepseek-chat, 6 维 1-4 分 → 加权 0-100 分）已通过双 Judge 交叉验证
      - Source documents 是天然 ground truth（可用于规则化 reward: NLI 验证引用真实性）
      - 不需要从头训练 reward model

  why_rl_might_not_work:
    capacity_ceiling: |
      exp-009 的 SFT 失败暗示一个更根本的问题：4B 模型可能根本学不会跨文档整合。
      qwen3-max 教师模型在整合维度也只拿 2.62/4，无人拿 4 分。
      跨文档推理可能是大参数量模型的特有能力，4B 规模的天花板就是 2.31（基线）。
      如果 baser-of-N at T=0.8 不能显著超越基线，说明天花板真的在 60.2 附近。

    exploration_bound: |
      RL/DPO 只能优化模型在已有能力内对行为分布的选择，不能赋予模型新能力。
      如果 T=0.8 下 5 个样本的方差极小（std < 2），说明模型在该任务上近乎确定性 ——
      没有"更好的输出"在分布中等待被发现。

    reward_cost: |
      即便 RL 可行，用 deepseek-chat Judge 做 reward model 的实际成本需要评估。
      每个 training step 的 rollout 评分调用量可能很大。
      （本实验不解决这个问题，只回答"有没有收益空间"）

  what_this_experiment_does_not_do:
    - "不训练任何 RL/DPO 模型（仅做可行性验证）"
    - "不修改检索 pipeline（固定 exp-004 精排 top-10）"
    - "不修改 prompt（沿用 exp-005 基线 prompt）"
    - "不评估所有 198 条（采样 50 条以控制 Judge API 成本）"
    - "不训练 reward model"


# =============================================================================
# 第二部分：实验设计
# =============================================================================

experiment_design:

  core_question: |
    "在温度 0.8 下从同一模型对同一 query+documents 多次采样，best-of-N
    的 Judge 评分是否显著高于 baseline（T=0.3 单次采样）？"

  judgment_criteria:
    likely_feasible:
      condition: "mean_delta(best_of_N, baseline) > 5 且 improved_query_pct > 40%"
      interpretation: "模型分布中存在更好的答案，RL/DPO 有望将这些优质输出概率提高"
    possibly_feasible:
      condition: "mean_delta > 2 且 avg_std > 3"
      interpretation: "输出有一定多样性，RL 有空间但收益可能有限，优先试 DPO on teacher data"
    unlikely_feasible_low_variance:
      condition: "avg_std < 2"
      interpretation: "温度 0.8 下模型近乎确定性，无探索空间。瓶颈在能力上限而非训练方法"
    unlikely_feasible_low_delta:
      condition: "mean_delta <= 2 或 improved_query_pct <= 10%"
      interpretation: "高温度无提升，T=0.3 下模型已接近最优。建议优先换大模型或优化 prompt"

  models_under_test:
    - id: "qwen3-4b-nothink"
      baseline_score: 60.2
      reason: "已验证的最佳性价比本地模型，SFT 在此模型上失败，是 RL 首选的验证对象"
      vllm_port: 8000
    - id: "qwen3-8b-nothink"
      baseline_score: "待评估（预期 65-70）"
      reason: "参数翻倍，预期整合能力自然更强。与 4B 的 best-of-N 对比可验证'能力上限决定 RL 收益'的假设"
      vllm_port: 8001

  sampling_config:
    num_queries: 50  # 从 dev 集 198 条中随机采样，seed=42
    num_samples_per_query: 5
    temperature: 0.8
    original_temperature: 0.3  # 基线生成温度
    total_generations: "50 × 5 × 2 模型 = 500"
    total_judge_calls: "500 × 2 批 = 1000 次 Judge API 调用"
    estimated_cost: "约 $2-4（deepseek-chat 计费）"

  pipeline:
    phase_1:
      name: "多样本生成"
      script: "scripts/exp011/generate_multi_sample.py"
      input: "results/exp005/input_queries.jsonl（198 条 dev 集）"
      output: "results/exp011/generation/{model}_t0.8_n5_s42.jsonl"
      key_params:
        temperature: 0.8
        num_samples: 5
        sample_size: 50
        seed: 42
        max_tokens: 1024
      notes: |
        每条 query 独立调用 vLLM 5 次。使用复合 query_id（如 1869_s0, 1869_s1）
        确保 Judge 评分阶段每个样本独立评分，不被缓存去重。

    phase_2:
      name: "Judge 评分"
      script: "scripts/exp011/run_judge.py"
      input: "results/exp011/generation/（Phase 1 输出）"
      output: "results/exp011/judge_scores/{model}_t0.8_n5_s42_judged.jsonl"
      key_params:
        judge_model: "deepseek-chat"
        judge_temperature: 0.0
        concurrency: 3
        stagger_delay: 0.5
      notes: |
        完全复用 exp-005 的 Judge pipeline（两批 6 维评分）。
        评分体系：准确性、安全性、相关性（Batch1）+ 整合质量、引文质量、用户体验（Batch2）。
        每批独立调用 Judge API，每条样本需要 2 次调用。

    phase_3:
      name: "可行性分析"
      script: "scripts/exp011/analyze_feasibility.py"
      input:
        - "results/exp011/judge_scores/（Phase 2 输出）"
        - "results/exp005/judge_scores/{model}_judged.jsonl（基线评分）"
      output:
        - "results/exp011/analysis/rl_feasibility_report.json（摘要）"
        - "results/exp011/analysis/rl_feasibility_full.json（含 per-query 细节）"
      metrics:
        - "mean_baseline vs mean_best_of_n vs mean_mean_of_n"
        - "per-query delta 分布（best_of_n - baseline）"
        - "avg_std（per-query 5 样本的评分标准差）"
        - "分维度 best-of-N delta（6 维独立分析）"
        - "Pass% 变化（baseline vs best-of-n）"
        - "改善/持平/退化 query 占比"


# =============================================================================
# 第三部分：分析维度与预期解读
# =============================================================================

analysis_dimensions:

  primary:
    overall_delta:
      question: "Best-of-5 平均比基线高多少分？"
      interpretation:
        delta_gt_5: "RL 有明显收益空间"
        delta_2_to_5: "RL 有边际收益，需评估投入产出比"
        delta_lt_2: "RL 收益不显著，瓶颈在其他地方"

    output_variance:
      question: "温度 0.8 下 5 个样本的评分分歧有多大？"
      metric: "per-query std（5 样本 Judge 评分的标准差）"
      interpretation:
        std_lt_2: "模型近乎确定性输出，RL 没有探索空间"
        std_2_to_5: "有一定多样性，RL 可以调整分布偏好"
        std_gt_5: "输出差异大，RL 空间充足但训练可能不稳定"

    query_level_distribution:
      question: "多少比例的 query 从 best-of-5 中受益？"
      interpretation:
        pct_gt_40: "多数 query 存在更好的答案，RL 普遍适用"
        pct_10_to_40: "部分 query 受益，RL 效应不均衡"
        pct_lt_10: "只有极少数 query 有提升，RL 性价比低"

  secondary:
    model_size_effect:
      question: "4B 和 8B 的 best-of-N delta 是否有差异？"
      hypothesis: |
        如果 8B 的 delta > 4B 的 delta，说明更大模型不仅基线更高，
        而且输出分布中存在更多优质变体 —— 能力上限决定 RL 收益。
        如果两者 delta 相似且都小，说明该任务本身对温度/采样不敏感。

    dimension_sensitivity:
      question: "哪些评分维度对采样温度最敏感？"
      hypothesis: |
        整合质量、引文质量、用户体验（exp-009 SFT 退化最严重的三个维度）
        可能在 T=0.8 下波动最大 —— 这些维度涉及"如何组织信息"的行为选择。
        准确性、安全性、相关性（SFT 前后无变化的三个维度）预期波动最小。

    delta_correlation_with_baseline:
      question: "基线分数低的 query 是否从多样化采样中受益更多？"
      hypothesis: |
        基线得 0 分的 query（完全答非所问）可能在 T=0.8 下有一些样本成功、
        一些失败，产生更大的评分方差。这类 query 的改善空间最大。


# =============================================================================
# 第四部分：执行计划
# =============================================================================

execution_plan:

  prerequisites:
    - "vLLM 服务启动：Qwen3-4B (port 8000) + Qwen3-8B (port 8001)"
    - "exp-005 基线评分文件存在于 results/exp005/judge_scores/"
    - ".env 中 DEEPSEEK_API_KEY 已配置（Judge 评分）"

  step_1_generate:
    description: "对 4B 和 8B 分别执行多样本生成"
    commands:
      4b: "python scripts/exp011/generate_multi_sample.py --model qwen3-4b-nothink --vllm-url http://localhost:8000/v1 --num-samples 5 --temperature 0.8 --sample-size 50 --seed 42"
      8b: "python scripts/exp011/generate_multi_sample.py --model qwen3-8b-nothink --vllm-url http://localhost:8001/v1 --num-samples 5 --temperature 0.8 --sample-size 50 --seed 42"
    estimated_time: "约 10-15 分钟/模型（vLLM 推理，取决于 GPU）"

  step_2_judge:
    description: "对两个模型的多样本结果评分"
    command: "python scripts/exp011/run_judge.py --all --concurrency 3"
    estimated_time: "约 30-45 分钟（1000 次 Judge API 调用，3 并发）"
    notes: "如果已有部分缓存，会自动跳过已评分的项目"

  step_3_analyze:
    description: "生成可行性报告"
    commands:
      4b: "python scripts/exp011/analyze_feasibility.py --model-id qwen3-4b-nothink"
      8b: "python scripts/exp011/analyze_feasibility.py --model-id qwen3-8b-nothink"
    estimated_time: "< 1 分钟"

  step_4_interpret:
    description: "根据报告判定下一步方向"
    decision_tree:
      both_feasible: |
        两个模型都显示 RL 可行 → 优先对 8B 做 DPO（利用 exp-009 教师数据作为 winner），
        后续考虑 4B GRPO（成本更低但需要更多 reward 优化）
      4b_infeasible_8b_feasible: |
        印证"能力上限决定 RL 收益"的假设 → 4B 的天花板确实是 60 分附近，
        应放弃 4B 训练路线，改用 8B 或 prompt 工程提升 4B
      both_infeasible: |
        RL/DPO 不适用于本场景 → 聚焦 exp-010 prompt 工程，
        或考虑换更大模型（Qwen3-14B / Qwen3-32B）直接提升基线


# =============================================================================
# 第五部分：风险与局限
# =============================================================================

risks_and_limitations:

  risks:
    - risk: "T=0.8 的 5 个样本可能不能充分代表输出分布"
      mitigation: "如果 std 极低或极高，可以加跑 50 条 × 10 样本作为验证"
    - risk: "50 条采样可能不代表全量 198 条的分布"
      mitigation: "报告中标注样本量，如果结果边界明显（delta 很大或很小），50 条已有足够统计效力"
    - risk: "Judge 本身在 T=0.8 的高温输出上评分一致性可能下降"
      mitigation: "Judge 使用 T=0.0 确定性评分，且 exp-005 已验证 Judge 可靠性"

  limitations:
    - "本实验只验证"收益空间存在与否"，不验证"实际 RL 训练能否收敛""
    - "Best-of-N 是 RL 收益的理论上界，实际 RL 训练（GRPO/PPO）只能逼近它"
    - "DPO（离线偏好学习）的收益比 best-of-N 更低，因为它不探索新的输出空间"
    - "未评估 reward hacking 风险 —— Judge 评分可能被模型学会'投其所好'"