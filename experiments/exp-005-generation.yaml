    selection_rationale: "新一代小模型 SOTA 代表——验证 Qwen3 的「小模型大能力」宣言在 AI 搜索任务上是否成立"
    expected_role: "小模型质量上限参照"

  # ========== Group B：本地中等模型 ==========

  - id: "qwen2.5-7b"
    name: "Qwen2.5-7B-Instruct"
    hf_id: "Qwen/Qwen2.5-7B-Instruct"
    series: "Qwen2.5"
    params: "7B"
    vram_fp16: "~14GB"
    vram_int4: "~4GB"
    context_len: 131072
    license: "Apache 2.0"
    chat_template: "qwen"
    notes: "中文社区最广泛使用的开源 7B 模型。如果 RTX 4090 FP16 显存紧张，使用 INT4 量化（GPTQ/AWQ）"
