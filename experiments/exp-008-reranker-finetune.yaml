    - "蒸馏方向：用微调后 gte-mul 的分数蒸馏更小的 Cross-Encoder（如 MiniLM），降低线上推理延迟"


# =============================================================================
# 参考资料
# =============================================================================

references:
  gte_mul:
    paper: "mGTE: Generalized Long-Context Text Representation and Reranking Models for Multilingual Text Retrieval"
    venue: "EMNLP 2024 Industry Track"
    hf: "https://huggingface.co/Alibaba-NLP/gte-multilingual-reranker-base"
    cmteb_r: 74.08
    key_finding: "弱监督训练对排序模型提升有限，最终仅用监督数据微调。排序模型超参与文本表示模型保持一致"
  bge_reranker:
    paper: "C-Pack: Packaged Resources For General Chinese Embeddings (SIGIR 2024)"
    arxiv: "2309.07597"
    key_finding: "Reranker 使用 BCE 微调，pairwise/listwise 仅带来 <1% NDCG 边际提升。负样本在训练前一次性构造（随机+BM25+Embedding 检索），非迭代式 mining"
  t2ranking:
    paper: "T2Ranking: A large-scale Chinese Benchmark for Passage Ranking (SIGIR 2023)"
    arxiv: "2304.03679"
    note: "训练集 258K query，qrels 含 4 级标注"
  exp007_experience:
    key_lessons:
      - "epochs=1 在大多数场景下已收敛，多训容易过拟合（Phase 1 3-epoch 达到平台，Phase 3.1 2-epoch 退化）"
      - "Hard negative mining 对 bi-encoder 是最大单一增益来源（+11.6% Recall@10），但其方法（FAISS 全库检索）无法直接移植到 Cross-Encoder"
      - "越简单的 Loss 越稳定（MNRL > CachedMNRL）"
      - "未经文献验证的自创训练策略风险高（Phase 3.1 自行设计 CachedMNRL → 退化）"
