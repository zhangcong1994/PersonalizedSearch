      - ["qwen2.5-3b", "3B", "~6GB", "32K", "本地", "性价比参照"]
      - ["qwen3-4b", "4B", "~8GB", "32K", "本地", "小模型上限"]
      - ["qwen2.5-7b", "7B", "~14GB", "128K", "本地(INT4备选)", "本地质量基准"]
      - ["deepseek-chat", "671B MoE", "API", "128K", "API", "质量上界"]
      - ["gpt-4o-mini", "未公开", "API", "128K", "API (可选)", "跨家族参照"]

