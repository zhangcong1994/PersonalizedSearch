experiments:
  - id: exp-001
    date: 2026-05-17
    name: BM25 vs Dense 基准对比
    plan_file: experiments/exp-001-retrieval-baseline.yaml
    description: 首次检索评估，验证 BM25 (B0) 与 Dense (B1) 在 T2Ranking 上的表现差异
    config:
      dataset: T2Ranking dev
      passage_pool: 150000（前 150k 条，原始 2,303,643 的 6.6%）
      embedding_model: BAAI/bge-small-zh-v1.5
      embedding_dim: 512
      queries_evaluated: 296（抽样 500 条中，有相关段落落入 passage 池的）
      top_k: 10
      bm25_impl: rank_bm25 (0.2.2)
      device: cpu
    results:
      BM25:
        Recall@1: 0.0000
        Recall@3: 0.0000
        Recall@5: 0.0002
        Recall@10: 0.0010
        MRR: 0.0011
        search_speed_ms_per_q: 35
      Dense:
        Recall@1: 0.1198
        Recall@3: 0.2218
        Recall@5: 0.2612
        Recall@10: 0.3064
        MRR: 0.6441
        search_speed_ms_per_q: 14
    delta:
      Recall_at_10: "+0.3054"
      MRR: "+0.6431"
    notes:
      - "BM25 在中文互联网段落上几乎完全失效（Recall@10 仅 0.1%）"
      - "Dense 检索 MRR 达到 0.64，语义检索远超关键词匹配"
      - "⚠️ 150k 池子仅覆盖约 65% 查询的相关段落，完整索引建好后数字会有变化"
      - "后续全量索引 + 更大抽样可获得更可靠的结论"

  - id: exp-001-e1
    date: 2026-05-18
    name: "E1: 嵌入模型对比 — bge-small-zh-v1.5 全量索引"
    plan_file: experiments/exp-001-retrieval-baseline.yaml
    phase: E1-M1 (embedding model comparison)
    config:
      dataset: T2Ranking dev
      passage_pool: 全量 ~2,303,643 passages
      embedding_model: BAAI/bge-small-zh-v1.5
      embedding_dim: 512
      queries_sampled: 2000
      queries_evaluated: "待补充（有相关段落落入池中的数量）"
      top_k: 10
      dense_strategy: similarity
      device: cuda (RTX 4090)
    results:
      Dense (similarity):
        Recall@1: 0.0772
        Recall@3: 0.2081
        Recall@5: 0.3113
        Recall@10: 0.4548
        MRR: 0.5097
    notes:
      - "全量 230 万 passage 索引，抽样 2000 条查询"
      - "相比旧 150k 浅池，Recall@10 从 0.31 升至 0.45，证明更大的 passage 池覆盖了更多相关文档"
      - "MRR 从 0.64 降至 0.51——全量池中正确文档排位被稀释，这是正常的池规模效应"
    status: running
    next: "等待 E1-M2 (bge-large-zh-v1.5) 索引完成并跑同 2000 条"

decisions:
  - date: 2026-05-16
    topic: 评估数据集选择
    decision: T2Ranking 为主力评估集，MIRACL 为辅助参考
    rationale:
      - T2Ranking 提供 30 万+ 真实中文查询、4 级细粒度标注、query types 标签
      - MIRACL 仅 1,500 条查询、二元标注、无语义类别，不适合消融实验
    status: accepted

  - date: 2026-05-17
    topic: T2Ranking 分片策略
    decision: 不分片，passage 即检索单元
    rationale:
      - qrels 按 qid→pid 映射，切片会破坏对应关系
      - passage 中位数 368 字符，天然适合作为检索单元
      - 保持评估简洁性优先
    status: accepted

  - date: 2026-05-17
    topic: 查询重写 & LLM 生成策略
    decision: V0 阶段全部使用 DeepSeek API，不部署本地模型
    rationale:
      - 查询重写每条约 ¥0.001，24k 条评估仅 ¥25
      - LLM 生成不影响检索评估指标，评估脚本可跳过生成环节
      - V1 阶段再考虑本地部署
    status: accepted

  - date: 2026-05-17
    topic: 向量库目录规范
    decision: 按 dataset/model/chunk 三级目录组织
    rationale:
      - 支持多嵌入模型、多分片策略并存，避免文件名冲突
      - index_registry.json 记录每个索引的元信息，评估脚本自动发现
    status: accepted

  - date: 2026-05-17
    topic: 计算资源策略
    decision: 本地完成评估脚本开发与小规模验证 → 租 AutoDL 跑全量实验
    rationale:
      - 本地 CPU 一次实验 30+ 小时，迭代太慢
      - AutoDL RTX 4090 约 ¥2-3/小时，一个完整实验周期约 ¥50-70
      - 先用本地 150k 池子跑通评估逻辑，再上服务器大批量跑
    status: accepted

