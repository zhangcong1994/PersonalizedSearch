# 实验计划：V0 LLM 生成阶段 —— 生成模型对比 + 评估标准实现 + 人机校准
# exp-005: 多开源生成模型在 AI 搜索场景下的生成质量对比
# 创建日期：2026-05-24
# 最后更新：2026-05-24

meta:
  experiment_id: exp-005
  phase: V0
  objective: "实现 AI 搜索生成质量评估标准，通过人机校准验证 LLM-as-a-Judge 的有效性，对比多个开源生成模型在固定检索输入下的答案质量"
  status: planned
  target_platform: "AutoDL (RTX 4090 24GB)"
  prerequisite: "exp-004 精排已完成（有最优 Reranker + top-K 排序结果）"
  design_principle: "固定检索-精排 pipeline 输出不变，仅更换生成模型。评估采用 LLM-as-a-Judge 范式，Judge 评估前先经过人机校准验证一致性"
  parallel_tracks:
    - "Track A: 实现评估标准代码（6 维核心生成阶段评估，分两批，后续可扩展至 11 维 + 6 层系统级整体报告）"
    - "Track B: 人机校准（人工标注 → Judge 一致性检验 → 校准 Judge Prompt）"
    - "Track C: 多模型生成对比（小模型部署 + 强 API 模型上限 → 统一评估）"


# =============================================================================
# 第一部分：动机 —— 为什么 exp-005 是实验链的最后一环
# =============================================================================

motivation:

  where_we_are:
    exp001_baseline: "单路检索基线 Recall@50 = 0.6531"
    exp003_best: "多路 RRF 融合 Recall@50 = 0.6912"
    exp004_best: "精排后 NDCG@10 提升（待 exp-004 完成后确定）"
    remaining_question: "最好的检索 + 最好的精排 → 喂给 LLM 生成答案，答案质量到底如何？哪个 LLM 最适合这个任务？"

  why_now:
    reason: "exp-001 到 exp-004 完成了检索链的全部优化，但最终用户看到的是 LLM 生成的答案。前面的优化都是为这一环节服务的——如果生成环节塌方，前面的努力都白费"
    urgency: "这是实验链的最后一环，决定了整个系统的最终用户体验"

  why_multiple_models:
    core_reason: "不同 LLM 在「阅读检索文档 → 综合信息 → 生成答案」这个任务上的表现差异巨大。需要量化对比才能做出有依据的选型决策"
    key_questions:
      - "Q1: 1.5B-4B 的小模型能否胜任 AI 搜索的生成任务？质量与 7B 差距多大？"
      - "Q2: Qwen3-4B 新一代小模型是否如官方宣称的「媲美大得多的模型」？"
      - "Q3: 本地部署模型与 DeepSeek API 的质量差距有多大？这个差距值得花钱吗？"
      - "Q4: 不同模型的短板分别在哪里？（准确性？综合质量？引文？拒答判断？）"

  why_human_calibration:
    core_reason: "LLM-as-a-Judge 不能自说自话。需要先证明 Judge 的评分与人类标注者一致，评估结果才有说服力"
    specific_needs:
      - "验证 6 维核心评估标准的可操作性（人类能否一致地按 Rubric 打分？后续扩展至 11 维）"
      - "确定 Judge LLM 在哪些维度上与人类一致，哪些维度需要特殊处理"
      - "校准 Judge Prompt（通过人机差异分析优化评分指令）"

  why_ideal_ranking:
    reason: "精排后的 top-10 仍可能包含不相关的 passage。用「理想排序」（qrels 中已知相关的 passage 排在最前）测试生成模型，可以测量生成质量的理论上限——排除检索噪声后 LLM 本身的极限在哪儿？"
    use_case: "如果某个模型在精排输入下表现差但在理想输入下表现好 → 问题在检索端。如果两个输入下都差 → 问题在生成端"


# =============================================================================
# 第二部分：候选生成模型
# =============================================================================

candidate_models:

  # ========== Group A：本地可部署模型（小模型，RTX 4090 24GB）==========

  - id: "qwen2.5-1.5b"
    name: "Qwen2.5-1.5B-Instruct"
    hf_id: "Qwen/Qwen2.5-1.5B-Instruct"
    series: "Qwen2.5"
    params: "1.5B"
    vram_fp16: "~3GB"
    vram_int4: "~1GB"
    context_len: 32768
    license: "Apache 2.0"
    chat_template: "qwen"
    selection_rationale: "最轻量基线——验证 AI 搜索生成任务的最小可行模型规模"
    expected_role: "质量下界参照"

  - id: "qwen2.5-3b"
    name: "Qwen2.5-3B-Instruct"
    hf_id: "Qwen/Qwen2.5-3B-Instruct"
    series: "Qwen2.5"
    params: "3B"
    vram_fp16: "~6GB"
    vram_int4: "~2GB"
    context_len: 32768
    license: "Apache 2.0"
    chat_template: "qwen"
    selection_rationale: "轻量但有一定生成质量——如果它与 7B 差距不大，3B 是生产部署的甜蜜点"
